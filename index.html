                    </a>
                  )}
                  <CommentThread parentCol="community_spots" parentId={s.id} onOpenProfile={onOpenProfile} />
                </div>
              </div>
            ))}
          </div>
        )}
      </CardShell>

      {lightboxSrc && <PhotoLightbox src={lightboxSrc} onClose={() => setLightboxSrc(null)} />}
      {showForm && <AddSpotForm onCancel={() => setShowForm(false)} onSaved={() => { setShowForm(false); load(); }} />}
    </>
  );
}

function AddSpotForm({ onCancel, onSaved }) {
  const [name, setName] = useState("");
  const [notes, setNotes] = useState("");
  const [photo, setPhoto] = useState(null);
  const [gps, setGps] = useState(null);
  const [gpsStatus, setGpsStatus] = useState("idle");
  const [saving, setSaving] = useState(false);

  const captureGps = useCallback(() => {
    if (!navigator.geolocation) {
      setGpsStatus("error");
      return;
    }
    setGpsStatus("locating");
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        setGps({ lat: pos.coords.latitude, lon: pos.coords.longitude });
        setGpsStatus("ok");
      },
      () => setGpsStatus("error"),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }, []);

  useEffect(() => { captureGps(); }, [captureGps]);

  async function submit() {
    if (!name.trim() || saving) return;
    setSaving(true);
    try {
      await window.communityAPI.addSpot({
        name: name.trim(),
        notes: notes.trim(),
        photo: photo || null,
        lat: gps ? gps.lat : null,
        lon: gps ? gps.lon : null,
      });
      onSaved();
    } catch (e) {
      setSaving(false);
    }
  }

  const inputStyle = { background: "var(--tb-surface-2)", color: "var(--tb-text)", border: "1px solid var(--tb-line)" };

  return (
    <div className="tb-overlay absolute inset-0 z-30" style={{ background: "rgba(10,16,19,0.65)" }}>
      <div className="tb-tray absolute bottom-0 left-0 right-0 rounded-t-2xl px-5 pt-4 pb-6" style={{ background: "var(--tb-bg)", border: "1px solid var(--tb-line)", maxHeight: "80%", overflowY: "auto" }}>
        <div className="flex items-center justify-between mb-4">
          <h2 className="tb-stencil text-xl" style={{ color: "var(--tb-text)" }}>ADD A SPOT</h2>
          <button onClick={onCancel}><X size={20} style={{ color: "var(--tb-muted)" }} /></button>
        </div>
        <div className="space-y-3">
          <Field label="Spot name">
            <input autoFocus value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. North Cove boat ramp" className="w-full rounded-lg py-2 px-3 text-sm outline-none" style={inputStyle} />
          </Field>
          <PhotoField photo={photo} onChange={setPhoto} label="Photo (optional)" />
          <Field label="Notes (optional)">
            <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={2} placeholder="What's good here, access tips, etc." className="w-full rounded-lg py-2 px-3 text-sm outline-none resize-none" style={inputStyle} />
          </Field>
          <Field label="Location">
            {gpsStatus === "locating" && (
              <div className="flex items-center gap-2 text-xs tb-mono rounded-lg py-2 px-3" style={inputStyle}>
                <RefreshCw size={13} className="tb-spin" style={{ color: "var(--tb-muted)" }} />
                <span style={{ color: "var(--tb-muted)" }}>Finding your location...</span>
              </div>
            )}
            {gpsStatus === "ok" && gps && (
              <div className="text-xs tb-mono rounded-lg py-2 px-3" style={inputStyle}>
                <span style={{ color: "var(--tb-text)" }}>{gps.lat.toFixed(4)}, {gps.lon.toFixed(4)}</span>
              </div>
            )}
            {gpsStatus === "error" && (
              <div className="flex items-center justify-between text-xs tb-mono rounded-lg py-2 px-3" style={inputStyle}>
                <span style={{ color: "var(--tb-muted)" }}>No location — spot will save without a pin.</span>
                <button type="button" onClick={captureGps} style={{ color: "var(--tb-brass)" }}>Try again</button>
              </div>
            )}
          </Field>
        </div>
        <div className="flex gap-3 mt-5">
          <button onClick={onCancel} className="flex-1 py-2.5 rounded-lg text-sm font-semibold" style={{ background: "var(--tb-surface-2)", color: "var(--tb-text)" }}>Cancel</button>
          <button onClick={submit} disabled={!name.trim() || saving} className="flex-1 py-2.5 rounded-lg text-sm font-semibold" style={{ background: name.trim() ? "var(--tb-brass)" : "var(--tb-surface-2)", color: name.trim() ? "var(--tb-bg)" : "var(--tb-muted)" }}>
            {saving ? "Saving..." : "Add spot"}
          </button>
        </div>
      </div>
    </div>
  );
}

function CommunityLeaderboard() {
  const [rows, setRows] = useState(null);
  const [error, setError] = useState(null);

  const load = useCallback(async () => {
    setError(null);
    try {
      const data = await window.communityAPI.getLeaderboard();
      setRows(data);
    } catch (e) {
      setError("Couldn't load the leaderboard right now.");
    }
  }, []);

  useEffect(() => { load(); }, [load]);

  return (
    <CardShell title="LEADERBOARD" subtitle="ranked by shared catches">
      <div className="flex justify-end mb-2">
        <button onClick={load} className="w-7 h-7 rounded-md flex items-center justify-center" style={{ background: "var(--tb-surface-2)" }}>
          <RefreshCw size={13} style={{ color: "var(--tb-muted)" }} />
        </button>
      </div>
      {error && <div className="tb-mono text-xs" style={{ color: "var(--tb-flare)" }}>{error}</div>}
      {!error && rows === null && <div className="tb-mono text-xs" style={{ color: "var(--tb-muted)" }}>Loading rankings...</div>}
      {!error && rows && rows.length === 0 && <EmptyState text="No shared catches yet to rank." />}
      {!error && rows && rows.length > 0 && (
        <div className="space-y-1.5">
          {rows.map((r, idx) => (
            <div key={r.nickname} className="flex items-center justify-between rounded-lg py-2 px-3" style={{ background: "var(--tb-surface-2)", border: "1px solid var(--tb-line)" }}>
              <div className="flex items-center gap-2 min-w-0">
                <span className="tb-mono text-xs w-5 text-center shrink-0" style={{ color: "var(--tb-brass)" }}>{idx + 1}</span>
                <span className="text-sm font-semibold truncate" style={{ color: "var(--tb-text)" }}>{r.nickname}</span>
              </div>
              <div className="tb-mono text-[11px] text-right shrink-0" style={{ color: "var(--tb-muted)" }}>
                {r.count} catch{r.count !== 1 ? "es" : ""}
                {r.bestLb > 0 ? ` · best ${r.bestLb.toFixed(1)} lb ${r.bestSpecies || ""}` : ""}
              </div>
            </div>
          ))}
        </div>
      )}
    </CardShell>
  );
}

function KnotsView() {
  const [category, setCategory] = useState("all");
  const [expanded, setExpanded] = useState({});

  const filtered = category === "all" ? KNOTS : KNOTS.filter((k) => k.category === category);

  function toggle(id) {
    setExpanded((prev) => ({ ...prev, [id]: !prev[id] }));
  }

  return (
    <div className="space-y-3">
      <div className="flex gap-2 overflow-x-auto tb-scroll" style={{ scrollbarWidth: "none" }}>
        {KNOT_CATEGORIES.map((c) => (
          <ChipButton key={c.id} active={category === c.id} onClick={() => setCategory(c.id)} label={c.label} />
        ))}
      </div>

      <div className="space-y-2">
        {filtered.map((knot) => {
          const isOpen = !!expanded[knot.id];
          const videoUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent("how to tie a " + knot.name + " fishing knot")}`;
          return (
            <div key={knot.id} className="rounded-xl overflow-hidden" style={{ background: "var(--tb-surface)", border: "1px solid var(--tb-line)" }}>
              <button onClick={() => toggle(knot.id)} className="w-full text-left px-4 py-3 flex items-center gap-3">
                <KnotIcon />
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2">
                    <span className="text-sm font-semibold" style={{ color: "var(--tb-text)" }}>{knot.name}</span>
                    <span className="tb-mono text-[9px] px-1.5 py-0.5 rounded-full shrink-0" style={{ background: "var(--tb-surface-2)", color: "var(--tb-brass)", border: "1px solid var(--tb-line)" }}>
                      {knot.difficulty}
                    </span>
                  </div>
                  <div className="tb-mono text-[11px] mt-0.5" style={{ color: "var(--tb-muted)" }}>{knot.useCase}</div>
                </div>
                <ChevronDown size={16} style={{ color: "var(--tb-muted)", transform: isOpen ? "rotate(180deg)" : "none", transition: "transform 0.15s" }} />
              </button>
              {isOpen && (
                <div className="px-4 pb-4" style={{ borderTop: "1px solid var(--tb-line)" }}>
                  <ol className="space-y-2 mt-3 list-decimal list-inside">
                    {knot.steps.map((step, idx) => (
                      <li key={idx} className="text-xs leading-relaxed" style={{ color: "var(--tb-text)" }}>{step}</li>
                    ))}
                  </ol>
                  <div className="tb-mono text-[11px] mt-3 rounded-lg p-2.5" style={{ background: "var(--tb-surface-2)", color: "var(--tb-muted)" }}>
                    <strong style={{ color: "var(--tb-brass)" }}>Tip: </strong>{knot.tip}
                  </div>
                  <a
                    href={videoUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="tb-mono text-[11px] mt-2 inline-flex items-center gap-1"
                    style={{ color: "var(--tb-blue)" }}
                  >
                    <ExternalLink size={11} /> Watch a video tutorial
                  </a>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------- Settings (license & limits, backup/restore) ---------------- */

async function exportAllData() {
  const data = { version: 1, exportedAt: new Date().toISOString() };
  try {
    const r = await window.storage.get(STORAGE_KEY, false);
    data.items = r && r.value ? JSON.parse(r.value) : [];
  } catch (e) {
    data.items = [];
  }
  try {
    const r = await window.storage.get(CATCH_KEY, false);
    data.catches = r && r.value ? JSON.parse(r.value) : [];
  } catch (e) {
    data.catches = [];
  }
  try {
    const r = await window.storage.get(LOCATION_KEY, false);
    data.location = r && r.value ? JSON.parse(r.value) : null;
  } catch (e) {
    data.location = null;
  }
  try {
    const r = await window.storage.get(LICENSE_KEY, false);
    data.license = r && r.value ? JSON.parse(r.value) : null;
  } catch (e) {
    data.license = null;
  }
  try {
    const r = await window.storage.get(WAYPOINT_KEY, false);
    data.waypoints = r && r.value ? JSON.parse(r.value) : [];
  } catch (e) {
    data.waypoints = [];
  }
  data.nickname = (typeof window !== "undefined" && window.communityAPI && window.communityAPI.getNickname)
    ? window.communityAPI.getNickname()
    : null;

  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `epic-fishy-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function importAllData(file) {
  const text = await file.text();
  const data = JSON.parse(text);
  if (Array.isArray(data.items)) await window.storage.set(STORAGE_KEY, JSON.stringify(data.items), false);
  if (Array.isArray(data.catches)) await window.storage.set(CATCH_KEY, JSON.stringify(data.catches), false);
  if (data.location) await window.storage.set(LOCATION_KEY, JSON.stringify(data.location), false);
  if (data.license) await window.storage.set(LICENSE_KEY, JSON.stringify(data.license), false);
  if (Array.isArray(data.waypoints)) await window.storage.set(WAYPOINT_KEY, JSON.stringify(data.waypoints), false);
  if (data.nickname && typeof window !== "undefined" && window.communityAPI && window.communityAPI.setNickname) {
    window.communityAPI.setNickname(data.nickname);
  }
}

function SettingsPanel({ onClose }) {
  const [loading, setLoading] = useState(true);
  const [expiry, setExpiry] = useState("");
  const [notes, setNotes] = useState("");
  const [saved, setSaved] = useState(false);
  const [importing, setImporting] = useState(false);
  const [importMsg, setImportMsg] = useState(null);
  const fileInputRef = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(LICENSE_KEY, false);
        if (r && r.value) {
          const parsed = JSON.parse(r.value);
          setExpiry(parsed.expiry ? parsed.expiry.slice(0, 10) : "");
          setNotes(parsed.notes || "");
        }
      } catch (e) {
        // no saved license info yet
      }
      setLoading(false);
    })();
  }, []);

  async function saveLicense() {
    const data = { expiry: expiry ? new Date(expiry).toISOString() : null, notes: notes.trim() };
    try {
      await window.storage.set(LICENSE_KEY, JSON.stringify(data), false);
      setSaved(true);
      setTimeout(() => setSaved(false), 1500);
    } catch (e) {
      // ignore
    }
  }

  const daysUntilExpiry = expiry ? Math.ceil((new Date(expiry) - new Date()) / 86400000) : null;

  async function handleImportFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setImporting(true);
    setImportMsg(null);
    try {
      await importAllData(file);
      setImportMsg("Import complete — reloading...");
      setTimeout(() => window.location.reload(), 1200);
    } catch (err) {
      setImportMsg("Couldn't read that file — make sure it's an Epic Fishy backup.");
      setImporting(false);
    }
  }

  const inputStyle = { background: "var(--tb-surface-2)", color: "var(--tb-text)", border: "1px solid var(--tb-line)" };

  return (
    <div className="tb-overlay absolute inset-0 z-40" style={{ background: "rgba(10,16,19,0.7)" }} onClick={onClose}>
      <div
        className="tb-tray absolute bottom-0 left-0 right-0 rounded-t-2xl px-5 pt-4 pb-6"
        style={{ background: "var(--tb-bg)", border: "1px solid var(--tb-line)", maxHeight: "85%", overflowY: "auto" }}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-center justify-between mb-4">
          <h2 className="tb-stencil text-xl" style={{ color: "var(--tb-text)" }}>SETTINGS</h2>
          <button onClick={onClose}><X size={20} style={{ color: "var(--tb-muted)" }} /></button>
        </div>

        <SafetyNotifyCard />

        <div className="h-3" />

        <AiScanCard />

        <div className="h-3" />

        <CardShell title="LICENSE & LIMITS">
          {loading ? (
            <div className="tb-mono text-xs" style={{ color: "var(--tb-muted)" }}>Loading...</div>
          ) : (
            <div className="space-y-3">
              <Field label="License expiration date">
                <input type="date" value={expiry} onChange={(e) => setExpiry(e.target.value)} className="w-full rounded-lg py-2 px-3 text-sm outline-none" style={inputStyle} />
              </Field>
              {daysUntilExpiry !== null && (
                <div className="tb-mono text-xs" style={{ color: daysUntilExpiry <= 14 ? "var(--tb-flare)" : "var(--tb-muted)" }}>
                  {daysUntilExpiry < 0
                    ? "Your license has expired."
                    : daysUntilExpiry === 0
                    ? "Expires today!"
                    : `Expires in ${daysUntilExpiry} day${daysUntilExpiry !== 1 ? "s" : ""}.`}
                </div>
              )}
              <Field label="Size & bag limits, notes">
                <textarea
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  rows={3}
                  placeholder="e.g. Largemouth bass: 5/day, 12in minimum at Clear Lake"
                  className="w-full rounded-lg py-2 px-3 text-sm outline-none resize-none"
                  style={inputStyle}
                />
              </Field>
              <button onClick={saveLicense} className="w-full py-2 rounded-lg text-xs tb-mono font-semibold" style={{ background: "var(--tb-brass)", color: "var(--tb-bg)" }}>
                {saved ? "Saved ✓" : "Save"}
              </button>
            </div>
          )}
        </CardShell>

        <div className="h-3" />

        <CardShell title="YOUR DATA">
          <div className="space-y-2">
            <button onClick={exportAllData} className="w-full py-2.5 rounded-lg text-xs tb-mono font-semibold" style={inputStyle}>
              Export a backup file
            </button>
            <input ref={fileInputRef} type="file" accept="application/json" onChange={handleImportFile} className="hidden" />
            <button
              onClick={() => fileInputRef.current && fileInputRef.current.click()}
              disabled={importing}
              className="w-full py-2.5 rounded-lg text-xs tb-mono font-semibold"
              style={inputStyle}
            >
              {importing ? "Importing..." : "Import a backup file"}
            </button>
            {importMsg && <div className="tb-mono text-[11px]" style={{ color: "var(--tb-muted)" }}>{importMsg}</div>}
            <p className="tb-mono text-[10px]" style={{ color: "var(--tb-muted)" }}>
              Importing replaces your current tackle box, catches, and location with the backup's contents.
              Worth doing this occasionally — everything lives only on this device otherwise.
            </p>
            <a href="privacy.html" target="_blank" rel="noopener noreferrer" className="tb-mono text-[11px] inline-block mt-1" style={{ color: "var(--tb-blue)" }}>
              Privacy policy
            </a>
          </div>
        </CardShell>

        <div className="h-3" />

        <UnitsCard />

        <div className="h-3" />

        <InstallCard />

        <AboutFooter />
      </div>
    </div>
  );
}

function UnitsCard() {

function InstallCard() {
  const [promptEvent, setPromptEvent] = useState(null);
  const [installed, setInstalled] = useState(() => window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  const [shared, setShared] = useState(null);

  useEffect(() => {
    const onPrompt = (e) => { e.preventDefault(); setPromptEvent(e); };
    const onInstalled = () => { setInstalled(true); setPromptEvent(null); };
    window.addEventListener("beforeinstallprompt", onPrompt);
    window.addEventListener("appinstalled", onInstalled);
    return () => {
      window.removeEventListener("beforeinstallprompt", onPrompt);
      window.removeEventListener("appinstalled", onInstalled);
    };
  }, []);

  async function install() {
    if (!promptEvent) return;
    haptic();
    promptEvent.prompt();
    try { await promptEvent.userChoice; } catch (e) { /* ignore */ }
    setPromptEvent(null);
  }

  async function shareApp() {
    haptic();
    const data = { title: "Epic Fishy", text: "Tackle box, conditions, catch log and a fishing community in one app.", url: APP_URL };
    try {
      if (navigator.share) { await navigator.share(data); setShared("Thanks for spreading the word"); }
      else { await navigator.clipboard.writeText(APP_URL); setShared("Link copied"); }
    } catch (e) { /* cancelled */ }
  }

  const btn = { background: "var(--tb-surface-2)", color: "var(--tb-text)", border: "1px solid var(--tb-line)" };
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

  return (
    <CardShell title="Get the app" subtitle="Works offline and opens like any other app">
      <div className="space-y-2">
        {installed ? (
          <div className="text-[14px]" style={{ color: "var(--tb-muted)" }}>Epic Fishy is installed on this device.</div>
        ) : promptEvent ? (
          <button onClick={install} className="w-full py-2.5 rounded-lg text-[14px] font-bold" style={{ background: "var(--tb-brass)", color: "var(--tb-bg)" }}>
            Add to home screen
          </button>
        ) : (
          <div className="text-[14px] leading-snug" style={{ color: "var(--tb-muted)" }}>
            {isIOS
              ? "In Safari, tap the Share button, then \"Add to Home Screen\"."
              : "In your browser menu, choose \"Install app\" or \"Add to Home screen\"."}
          </div>
        )}
        <button onClick={shareApp} className="w-full py-2.5 rounded-lg text-[14px] font-bold" style={btn}>
          Share Epic Fishy with a friend
        </button>
        {shared && <div className="text-[13px]" style={{ color: "var(--tb-brass)" }}>{shared}</div>}
      </div>
    </CardShell>
  );
}

function AboutFooter() {
  return (
    <div className="pt-6 pb-2 text-center">
      <div className="flex items-center justify-center gap-2">
        <BrandMark />
        <span className="tb-stencil text-[20px]" style={{ color: "var(--tb-text)" }}>EPIC FISHY</span>
      </div>
      <div className="text-[13px] mt-2" style={{ color: "var(--tb-muted)" }}>Version {APP_VERSION}</div>
      <div className="text-[14px] font-bold mt-1" style={{ color: "var(--tb-brass)" }}>Powered by {MAKER}</div>
      <div className="text-[12px] mt-2" style={{ color: "var(--tb-muted)" }}>
        Weather by Open-Meteo and the National Weather Service. Tides by NOAA. Map data by OpenStreetMap contributors.
      </div>
    </div>
  );
}

  const [expanded, setExpanded] = useState({});

  const filtered = category === "all" ? TACKLE_REFERENCE : TACKLE_REFERENCE.filter((t) => t.category === category);

  function toggle(id) {
    setExpanded((prev) => ({ ...prev, [id]: !prev[id] }));
  }

  return (
    <div className="space-y-3">
      <p className="tb-mono text-[11px] px-1" style={{ color: "var(--tb-muted)" }}>
        Original diagrams to help identify what's in your box — tap any one for details.
      </p>
      <div className="flex gap-2 overflow-x-auto tb-scroll" style={{ scrollbarWidth: "none" }}>
        {TACKLE_REF_CATEGORIES.map((c) => (
          <ChipButton key={c.id} active={category === c.id} onClick={() => setCategory(c.id)} label={c.label} />
        ))}
      </div>

      <div className="grid grid-cols-2 gap-2">
        {filtered.map((t) => {
          const isOpen = !!expanded[t.id];
          return (
            <button
              key={t.id}
              onClick={() => toggle(t.id)}
              className="rounded-xl p-3 text-left"
              style={{ background: "var(--tb-surface)", border: "1px solid var(--tb-line)", gridColumn: isOpen ? "1 / -1" : undefined }}
            >
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-lg flex items-center justify-center shrink-0" style={{ background: "var(--tb-surface-2)" }}>
                  <TackleRefIcon type={t.id} />
                </div>
                <span className="text-sm font-semibold" style={{ color: "var(--tb-text)" }}>{t.name}</span>
              </div>
              {isOpen && (
                <div className="mt-2">
                  <p className="text-xs leading-relaxed" style={{ color: "var(--tb-muted)" }}>{t.desc}</p>
                  {t.steps && (
                    <>
                      <div className="tb-mono text-[10px] mt-3 mb-1" style={{ color: "var(--tb-brass)" }}>HOW TO RIG IT</div>
                      <ol className="space-y-1.5 list-decimal list-inside">
                        {t.steps.map((step, idx) => (
                          <li key={idx} className="text-xs leading-relaxed" style={{ color: "var(--tb-text)" }}>{step}</li>
                        ))}
                      </ol>
                    </>
                  )}
                </div>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}


const root = createRoot(document.getElementById("root"));
root.render(<TackleTracker />);
window.__tackleAppMounted = true;

</script>
</body>
</html>
