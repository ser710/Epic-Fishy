function TideCard({ tide, loading, error }) {
  if (loading) return <CardShell><span className="tb-mono text-xs" style={{ color: "var(--tb-muted)" }}>Loading tides...</span></CardShell>;
  if (error) return <CardShell title="TIDES"><span className="tb-mono text-xs" style={{ color: "var(--tb-muted)" }}>{error}</span></CardShell>;
  if (!tide) return null;

  return (
    <CardShell title="TIDES" subtitle={`nearest station: ${tide.station.name} (${tide.distance.toFixed(1)} mi)`}>
      {tide.predictions.length === 0 ? (
        <span className="tb-mono text-xs" style={{ color: "var(--tb-muted)" }}>No predictions available.</span>
      ) : (
        <div className="space-y-1.5">
          {tide.predictions.map((p, idx) => {
            const isHigh = p.type === "H";
            const dt = new Date(p.t.replace(" ", "T"));
            return (
              <div key={idx} className="flex items-center justify-between tb-mono text-xs">
                <div className="flex items-center gap-1.5" style={{ color: "var(--tb-text)" }}>
                  <ArrowUp size={12} style={{ color: isHigh ? "var(--tb-blue)" : "var(--tb-brass)", transform: isHigh ? "none" : "rotate(180deg)" }} />
                  {isHigh ? "High" : "Low"}
                </div>
                <div style={{ color: "var(--tb-muted)" }}>
                  {dt.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}
                </div>
                <div style={{ color: "var(--tb-text)" }}>{Number(p.v).toFixed(1)} ft</div>
              </div>
            );
          })}
        </div>
      )}

}

              key={rec.title}

            >

// Titles are written in capitals around the codebase; show them as normal sentences.
function sentenceCase(t) {
  return typeof t === "string" && /[A-Z]/.test(t) && t === t.toUpperCase() ? t.charAt(0) + t.slice(1).toLowerCase() : t;
}

function CardShell({ title, subtitle, children, noPad }) {
  return (
    <section className="rounded-2xl overflow-hidden" style={{ background: "var(--tb-surface)", border: "1px solid var(--tb-line)" }}>
      {title && (
        <div className="px-4 pt-4 pb-2" style={{ borderBottom: noPad ? "1px solid var(--tb-line)" : "none" }}>
          <h2 className="text-[18px] font-bold leading-tight" style={{ color: "var(--tb-text)" }}>{sentenceCase(title)}</h2>
          {subtitle && <p className="text-[14px] mt-0.5 leading-snug" style={{ color: "var(--tb-muted)" }}>{(() => { const t = sentenceCase(subtitle); return typeof t === "string" ? t.charAt(0).toUpperCase() + t.slice(1) : t; })()}</p>}
        </div>
      )}
      <div className={noPad ? "" : "px-4 pb-4 pt-1.5"}>{children}</div>
    </section>
  );
}

function LocationPicker({ onPick, onClose, onUseMyLocation }) {
  const [query, setQuery] = useState("");
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(null);

  async function search() {
    if (!query.trim()) return;
    setLoading(true);
    setErr(null);
    try {
      const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=6`);
      const data = await res.json();
      setResults(data.results || []);
      if (!data.results || data.results.length === 0) setErr("No matches found.");
    } catch (e) {
      setErr("Search failed — check your connection.");
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="tb-overlay absolute inset-0 z-30 flex items-end" style={{ background: "rgba(10,16,19,0.65)" }} onClick={onClose}>
      <div className="tb-tray w-full rounded-t-2xl px-5 pt-4 pb-6" style={{ background: "var(--tb-bg)", border: "1px solid var(--tb-line)", maxHeight: "80%", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h2 className="tb-stencil text-xl" style={{ color: "var(--tb-text)" }}>SET LOCATION</h2>
          <button onClick={onClose}><X size={20} style={{ color: "var(--tb-muted)" }} /></button>
        </div>

        {onUseMyLocation && (
          <button onClick={onUseMyLocation} className="w-full mb-3 py-2.5 rounded-lg text-sm font-semibold" style={{ background: "var(--tb-surface-2)", color: "var(--tb-text)" }}>
            Use my current location
          </button>
        )}

        <div className="flex gap-2 mb-3">
          <input
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && search()}
            placeholder="City, lake, or coastal town..."
            className="flex-1 rounded-lg py-2 px-3 text-sm outline-none"
            style={{ background: "var(--tb-surface-2)", color: "var(--tb-text)", border: "1px solid var(--tb-line)" }}
          />
          <button onClick={search} className="px-4 rounded-lg text-sm font-semibold" style={{ background: "var(--tb-brass)", color: "var(--tb-bg)" }}>
            Go
          </button>
        </div>

        {loading && <div className="tb-mono text-xs" style={{ color: "var(--tb-muted)" }}>Searching...</div>}
        {err && <div className="tb-mono text-xs" style={{ color: "var(--tb-flare)" }}>{err}</div>}

        <div className="space-y-2">
          {results.map((r, idx) => (
            <button
              key={idx}
              onClick={() => onPick({ name: [r.name, r.admin1, r.country_code].filter(Boolean).join(", "), lat: r.latitude, lon: r.longitude })}
              className="w-full text-left rounded-lg p-3"
              style={{ background: "var(--tb-surface)", border: "1px solid var(--tb-line)" }}
            >
              <div className="text-sm font-semibold" style={{ color: "var(--tb-text)" }}>{r.name}</div>
              <div className="tb-mono text-[11px]" style={{ color: "var(--tb-muted)" }}>{[r.admin1, r.country].filter(Boolean).join(", ")}</div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Spots (personal catch stats + nearby waters) ---------------- */

function WaypointsCard() {
  const [points, setPoints] = useState(null);
  const [status, setStatus] = useState("idle"); // idle | locating
  const [error, setError] = useState(null);
  const [note, setNote] = useState(null);
  const [namingId, setNamingId] = useState(null);
  const [nameDraft, setNameDraft] = useState("");

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(WAYPOINT_KEY, false);
        setPoints(r && r.value ? JSON.parse(r.value) : []);
      } catch (e) {
        setPoints([]);
      }
    })();
  }, []);

  async function persist(next) {
    setPoints(next);
    try {
      await window.storage.set(WAYPOINT_KEY, JSON.stringify(next), false);
    } catch (e) {
      setError("Couldn't save — your device storage may be full.");
    }
  }

  function logHere() {
    if (status === "locating") return;
    setError(null);
    setNote(null);
    if (!navigator.geolocation) {
      setError("This device doesn't support GPS in the browser.");
      return;
    }
    setStatus("locating");
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const wp = {
          id: uid(),
          lat: pos.coords.latitude,
          lon: pos.coords.longitude,
          accuracyFt: Math.round(pos.coords.accuracy * 3.28084),
          time: new Date().toISOString(),
          name: "",
        };
        haptic("success");
        persist([wp, ...(points || [])]);
        setNamingId(wp.id);
        setNameDraft("");
        setStatus("idle");
      },
      (err) => {
        setStatus("idle");
        setError(
          err.code === 1
            ? "Location permission was denied — allow location for this app in your phone's settings."
            : err.code === 3
            ? "Couldn't get a GPS fix in time — step outside or try again."
            : "Location isn't available right now."
        );
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  }

  function saveName(id) {
    persist((points || []).map((p) => (p.id === id ? { ...p, name: nameDraft.trim() } : p)));
    setNamingId(null);
  }

  function remove(id) {
    persist((points || []).filter((p) => p.id !== id));
    if (namingId === id) setNamingId(null);
  }

  async function shareAsSpot(wp) {
    const ok = window.confirm("Share this exact location with the whole community as a spot?");
    if (!ok) return;
    try {
      await window.communityAPI.addSpot({
        name: wp.name || "Waypoint",
        notes: "",
        photo: null,
        lat: wp.lat,
        lon: wp.lon,
      });
      setNote("Shared to Community → Spots ✓");
    } catch (e) {
      setError("Couldn't share that spot — try again.");
    }
  }

  const canShare = !!(window.communityAPI && window.communityAPI.signedIn);

  return (
    <CardShell title="MY WAYPOINTS" subtitle="one tap saves where you are right now">
      <button
        onClick={logHere}
        disabled={status === "locating"}
        className="w-full py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2"
        style={{ background: "var(--tb-brass)", color: "var(--tb-bg)" }}
      >
        {status === "locating" ? (
          <>
            <RefreshCw size={15} className="tb-spin" /> Getting GPS fix...
          </>
        ) : (
          <>
            <MapPin size={16} /> Log my location
          </>
        )}
      </button>

      {error && <div className="tb-mono text-xs mt-2" style={{ color: "var(--tb-flare)" }}>{error}</div>}
      {note && <div className="tb-mono text-xs mt-2" style={{ color: "var(--tb-brass)" }}>{note}</div>}

      {points && points.length === 0 && (
        <div className="tb-mono text-xs mt-3" style={{ color: "var(--tb-muted)" }}>
          Nothing logged yet. Tap the button when you're on a spot you want to remember — boat ramp, a drop-off, a good bank.
        </div>
      )}

      <div className="space-y-2 mt-3">
        {(points || []).map((wp) => (
          <div key={wp.id} className="rounded-lg p-3" style={{ background: "var(--tb-surface-2)", border: "1px solid var(--tb-line)" }}>
            {namingId === wp.id ? (
              <div className="flex gap-2 mb-2">
                <input
                  autoFocus
                  value={nameDraft}
                  onChange={(e) => setNameDraft(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && saveName(wp.id)}
                  placeholder="Name this spot (optional)"
                  className="flex-1 min-w-0 rounded-lg py-2 px-3 text-sm outline-none"
                  style={{ background: "var(--tb-surface)", color: "var(--tb-text)", border: "1px solid var(--tb-line)" }}
                />
                <button onClick={() => saveName(wp.id)} className="px-3 rounded-lg text-xs tb-mono font-semibold" style={{ background: "var(--tb-brass)", color: "var(--tb-bg)" }}>
                  Save
                </button>
              </div>
            ) : (
              <div className="flex items-center justify-between gap-2">
                <button
                  onClick={() => { setNamingId(wp.id); setNameDraft(wp.name || ""); }}
                  className="text-sm font-semibold text-left truncate"
                  style={{ color: "var(--tb-text)" }}
                >
                  {wp.name || "Waypoint"} <Pencil size={11} className="inline ml-1" style={{ color: "var(--tb-muted)" }} />
                </button>
                <button onClick={() => remove(wp.id)} aria-label="Delete waypoint">
                  <Trash2 size={14} style={{ color: "var(--tb-flare)" }} />
                </button>
              </div>
            )}
            <div className="tb-mono text-[11px]" style={{ color: "var(--tb-muted)" }}>
              {new Date(wp.time).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}
              {" · "}
              {wp.lat.toFixed(5)}, {wp.lon.toFixed(5)}
              {typeof wp.accuracyFt === "number" ? ` · ±${wp.accuracyFt} ft` : ""}
            </div>
            <div className="flex flex-wrap gap-x-4 gap-y-1 mt-1.5">
              <a href={`https://www.google.com/maps?q=${wp.lat},${wp.lon}`} target="_blank" rel="noopener noreferrer" className="tb-mono text-[11px]" style={{ color: "var(--tb-blue)" }}>
                Open in Maps
              </a>
              <a href={`https://www.google.com/maps/dir/?api=1&destination=${wp.lat},${wp.lon}`} target="_blank" rel="noopener noreferrer" className="tb-mono text-[11px]" style={{ color: "var(--tb-blue)" }}>
                Directions
              </a>
              {canShare && (
                <button onClick={() => shareAsSpot(wp)} className="tb-mono text-[11px]" style={{ color: "var(--tb-blue)" }}>
                  Share as community spot
                </button>
              )}
            </div>
          </div>
        ))}
      </div>
    </CardShell>
  );
}

function SpotsView({ catches }) {
  const [location, setLocation] = useState(null);
  const [locLoading, setLocLoading] = useState(true);
  const [showLocationPicker, setShowLocationPicker] = useState(false);

  const [nearby, setNearby] = useState(null);
  const [nearbyLoading, setNearbyLoading] = useState(false);
  const [nearbyError, setNearbyError] = useState(null);

  const [marinas, setMarinas] = useState(null);
  const [marinasLoading, setMarinasLoading] = useState(false);
  const [marinasError, setMarinasError] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(LOCATION_KEY, false);
        if (res && res.value) setLocation(JSON.parse(res.value));
      } catch (e) {
        // no saved location yet
      }
      setLocLoading(false);
    })();
  }, []);

  const saveLocation = useCallback(async (loc) => {
    setLocation(loc);
    try {
      await window.storage.set(LOCATION_KEY, JSON.stringify(loc), false);
      window.dispatchEvent(new Event("tackle-location-changed"));
    } catch (e) {
      // ignore, just won't persist
    }
  }, []);

  const loadNearby = useCallback(async (lat, lon) => {
    setNearbyLoading(true);
    setNearbyError(null);
    try {
      const query = `[out:json][timeout:25];(node["leisure"="fishing"](around:24000,${lat},${lon});way["leisure"="fishing"](around:24000,${lat},${lon});way["natural"="water"](around:24000,${lat},${lon});way["waterway"="river"](around:24000,${lat},${lon}););out center 60;`;
      const res = await fetch("https://overpass-api.de/api/interpreter", {
        method: "POST",
        body: query,
      });
      if (!res.ok) throw new Error("overpass request failed");
      const data = await res.json();
      const seen = new Set();
      const spots = [];
      for (const el of data.elements || []) {
        const elLat = el.lat ?? el.center?.lat;
        const elLon = el.lon ?? el.center?.lon;
        const name = el.tags?.name;
        if (elLat == null || elLon == null || !name || seen.has(name)) continue;
        seen.add(name);
        const type = el.tags?.leisure === "fishing" ? "Fishing spot" : el.tags?.waterway === "river" ? "River" : "Lake / pond";
        spots.push({ name, type, lat: elLat, lon: elLon, distance: haversineMiles(lat, lon, elLat, elLon) });
      }
      spots.sort((a, b) => a.distance - b.distance);
      setNearby(spots.slice(0, 10));
    } catch (e) {
      setNearbyError("Couldn't reach map data right now — try again in a bit.");
    } finally {
      setNearbyLoading(false);
    }
  }, []);

  useEffect(() => {
    if (location) loadNearby(location.lat, location.lon);
  }, [location, loadNearby]);

  const loadMarinas = useCallback(async (lat, lon) => {
    setMarinasLoading(true);
    setMarinasError(null);
    try {
      const query = `[out:json][timeout:25];(node["leisure"="marina"](around:40000,${lat},${lon});way["leisure"="marina"](around:40000,${lat},${lon}););out center 20;`;
      const res = await fetch("https://overpass-api.de/api/interpreter", {
        method: "POST",
        body: query,
      });
      if (!res.ok) throw new Error("overpass request failed");
      const data = await res.json();
      const seen = new Set();
      const found = [];
      for (const el of data.elements || []) {
        const elLat = el.lat ?? el.center?.lat;
        const elLon = el.lon ?? el.center?.lon;
        const name = el.tags?.name;
        if (elLat == null || elLon == null || !name || seen.has(name)) continue;
        seen.add(name);
        found.push({ name, lat: elLat, lon: elLon, distance: haversineMiles(lat, lon, elLat, elLon) });
      }
      found.sort((a, b) => a.distance - b.distance);
      const nearest = found.slice(0, 6);

      // Fetch water temp for each nearby marina in parallel; missing data (common for
      // small/inland marinas) just shows as unavailable rather than failing the whole list.
      const withTemps = await Promise.all(
        nearest.map(async (m) => {
          try {
            const wres = await fetch(
              `https://marine-api.open-meteo.com/v1/marine?latitude=${m.lat}&longitude=${m.lon}&current=sea_surface_temperature&temperature_unit=fahrenheit&timezone=auto`
            );
            const wdata = await wres.json();
            const temp = wdata.current?.sea_surface_temperature;
            return { ...m, waterTemp: typeof temp === "number" ? temp : null };
          } catch (e) {
            return { ...m, waterTemp: null };
          }
        })
      );
      setMarinas(withTemps);
    } catch (e) {
      setMarinasError("Couldn't reach map data right now — try again in a bit.");
    } finally {
      setMarinasLoading(false);
    }
  }, []);

  useEffect(() => {
    if (location) loadMarinas(location.lat, location.lon);
  }, [location, loadMarinas]);

  function useMyLocation() {
    setLocLoading(true);
    if (!navigator.geolocation) {
      setLocLoading(false);
      setShowLocationPicker(true);
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        saveLocation({ name: "Current location", lat: pos.coords.latitude, lon: pos.coords.longitude });
        setLocLoading(false);
      },
      () => {
        setLocLoading(false);
        setShowLocationPicker(true);
      },
      { timeout: 8000 }
    );
  }

  const clusters = clusterCatchesByLocation(catches);

  if (locLoading) {
    return <div className="py-16 text-center" style={{ color: "var(--tb-muted)" }}>Loading spots...</div>;
  }

  return (
    <div className="space-y-3">
      <WaypointsCard />

      <CardShell title="YOUR BEST SPOTS" subtitle="ranked from your GPS-tagged catches">
        {clusters.length === 0 ? (
          <EmptyState text="Log a few GPS-tagged catches and your top spots will show up here." />
        ) : (
          <div className="space-y-2">
            {clusters.slice(0, 5).map((cl, idx) => (
              <div key={idx} className="rounded-lg p-3" style={{ background: "var(--tb-surface-2)", border: "1px solid var(--tb-line)" }}>
                <div className="flex items-center justify-between gap-2">
                  <div className="text-sm font-semibold truncate" style={{ color: "var(--tb-text)" }}>
                    {cl.name || `Spot ${idx + 1}`}
                  </div>
                  <span className="tb-mono text-[10px] px-2 py-0.5 rounded-full shrink-0" style={{ background: "var(--tb-brass)", color: "var(--tb-bg)" }}>
                    {cl.count} catch{cl.count !== 1 ? "es" : ""}
                  </span>
                </div>
                <div className="tb-mono text-[11px] mt-1" style={{ color: "var(--tb-muted)" }}>
                  {[
                    `${cl.speciesCount} species`,
                    cl.bestWeightLb > 0 ? `best ${cl.bestWeightLb.toFixed(1)} lb` : null,
                    cl.topLure ? `${cl.topLure} working best` : null,
                  ].filter(Boolean).join(" · ")}
                </div>
                <a
                  href={`https://www.google.com/maps?q=${cl.lat},${cl.lon}`}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="tb-mono text-[11px] mt-1.5 inline-flex items-center gap-1"
                  style={{ color: "var(--tb-blue)" }}
                >
                  <MapPin size={11} /> Open in Maps
                </a>
              </div>
            ))}
          </div>
        )}
      </CardShell>

      <CardShell title="NEARBY WATERS TO TRY" subtitle="pulled live from open map data">
        <div className="flex items-center justify-between mb-2">
          <button onClick={() => setShowLocationPicker(true)} className="flex items-center gap-1.5 text-xs tb-mono" style={{ color: "var(--tb-text)" }}>
            <MapPin size={13} style={{ color: "var(--tb-brass)" }} />
            {location ? location.name : "Set a search location"}
          </button>
          {location && (
            <button onClick={() => loadNearby(location.lat, location.lon)} className="w-7 h-7 rounded-md flex items-center justify-center" style={{ background: "var(--tb-surface-2)" }}>
              <RefreshCw size={13} className={nearbyLoading ? "tb-spin" : ""} style={{ color: "var(--tb-muted)" }} />
            </button>
          )}
        </div>

        {!location && (
          <button onClick={useMyLocation} className="w-full py-2 rounded-lg text-xs tb-mono" style={{ background: "var(--tb-surface-2)", color: "var(--tb-text)", border: "1px solid var(--tb-line)" }}>
            Use my current location
          </button>
        )}

        {location && nearbyLoading && <div className="tb-mono text-xs" style={{ color: "var(--tb-muted)" }}>Searching nearby waters...</div>}
        {location && nearbyError && <div className="tb-mono text-xs" style={{ color: "var(--tb-flare)" }}>{nearbyError}</div>}
        {location && !nearbyLoading && !nearbyError && nearby && nearby.length === 0 && (
          <div className="tb-mono text-xs" style={{ color: "var(--tb-muted)" }}>No named waters found nearby — try a different spot.</div>
        )}
        {location && !nearbyLoading && nearby && nearby.length > 0 && (
          <div className="space-y-1.5">
            {nearby.map((s, idx) => (
              <a
                key={idx}
                href={`https://www.google.com/maps?q=${s.lat},${s.lon}`}
                target="_blank"
                rel="noopener noreferrer"
                className="flex items-center justify-between rounded-lg py-2 px-3"
                style={{ background: "var(--tb-surface-2)", border: "1px solid var(--tb-line)" }}
              >
                <div className="min-w-0">
                  <div className="text-xs font-semibold truncate" style={{ color: "var(--tb-text)" }}>{s.name}</div>
                  <div className="tb-mono text-[10px]" style={{ color: "var(--tb-muted)" }}>{s.type}</div>
                </div>
                <div className="tb-mono text-[11px] shrink-0" style={{ color: "var(--tb-blue)" }}>{s.distance.toFixed(1)} mi</div>
              </a>
            ))}
          </div>
        )}
        <div className="tb-mono text-[9px] mt-2" style={{ color: "var(--tb-muted)" }}>
          Map data © OpenStreetMap contributors
        </div>
      </CardShell>

      <CardShell title="NEARBY MARINAS" subtitle="water temperature at each, where available">
        {!location && (
          <div className="tb-mono text-xs" style={{ color: "var(--tb-muted)" }}>Set a location above to see nearby marinas.</div>
        )}
        {location && (
          <>
            <div className="flex justify-end mb-2">
              <button onClick={() => loadMarinas(location.lat, location.lon)} className="w-7 h-7 rounded-md flex items-center justify-center" style={{ background: "var(--tb-surface-2)" }}>
                <RefreshCw size={13} className={marinasLoading ? "tb-spin" : ""} style={{ color: "var(--tb-muted)" }} />
              </button>
            </div>
            {marinasLoading && <div className="tb-mono text-xs" style={{ color: "var(--tb-muted)" }}>Finding nearby marinas...</div>}
            {marinasError && <div className="tb-mono text-xs" style={{ color: "var(--tb-flare)" }}>{marinasError}</div>}
            {!marinasLoading && !marinasError && marinas && marinas.length === 0 && (
              <div className="tb-mono text-xs" style={{ color: "var(--tb-muted)" }}>No named marinas found within about 25 miles.</div>
            )}
            {!marinasLoading && marinas && marinas.length > 0 && (
              <div className="space-y-1.5">
                {marinas.map((m, idx) => (
                  <a
                    key={idx}
                    href={`https://www.google.com/maps?q=${m.lat},${m.lon}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="flex items-center justify-between rounded-lg py-2 px-3"
                    style={{ background: "var(--tb-surface-2)", border: "1px solid var(--tb-line)" }}
                  >
                    <div className="min-w-0">
                      <div className="text-xs font-semibold truncate" style={{ color: "var(--tb-text)" }}>{m.name}</div>
                      <div className="tb-mono text-[10px]" style={{ color: "var(--tb-muted)" }}>{m.distance.toFixed(1)} mi away</div>
                    </div>
                    <div className="tb-mono text-xs shrink-0 flex items-center gap-1" style={{ color: typeof m.waterTemp === "number" ? "var(--tb-brass)" : "var(--tb-muted)" }}>
                      <Waves size={12} />
                      {typeof m.waterTemp === "number" ? `${Math.round(m.waterTemp)}°F` : "no data"}
                    </div>
                  </a>
                ))}
              </div>
            )}
            <div className="tb-mono text-[9px] mt-2" style={{ color: "var(--tb-muted)" }}>
              Map data © OpenStreetMap contributors · water temps from Open-Meteo
            </div>
          </>
        )}
      </CardShell>

      {showLocationPicker && (
        <LocationPicker
          onPick={(loc) => { saveLocation(loc); setShowLocationPicker(false); }}
          onClose={() => setShowLocationPicker(false)}
          onUseMyLocation={useMyLocation}
        />
      )}
    </div>
  );
}

function CommunityAuthForm({ onSignedIn }) {
  const [mode, setMode] = useState("signin"); // signin | signup
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);

  async function submit() {
    if (!email.trim() || !password) return;
    setLoading(true);
    setError(null);
    const fn = mode === "signup" ? window.communityAPI.signUp : window.communityAPI.signIn;
    const result = await fn(email.trim(), password);
    setLoading(false);
    if (result.error) {
      setError(result.error);
    } else {
      onSignedIn();
    }
  }

  const inputStyle = { background: "var(--tb-surface-2)", color: "var(--tb-text)", border: "1px solid var(--tb-line)" };

  return (
    <CardShell title={mode === "signup" ? "CREATE AN ACCOUNT" : "SIGN IN"} subtitle="to post catches, spots, and see the leaderboard">
      <div className="space-y-3">
        <Field label="Email">
          <input
            type="email"
            autoCapitalize="none"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            className="w-full rounded-lg py-2 px-3 text-sm outline-none"
            style={inputStyle}
          />
        </Field>
        <Field label="Password">
          <input
            type="password"
            value={password}
            onChange={(e) => setPassword(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && submit()}
            placeholder={mode === "signup" ? "At least 6 characters" : ""}
            className="w-full rounded-lg py-2 px-3 text-sm outline-none"
            style={inputStyle}
          />
        </Field>
        {error && <div className="tb-mono text-xs" style={{ color: "var(--tb-flare)" }}>{error}</div>}
        <button
          onClick={submit}
          disabled={!email.trim() || !password || loading}
          className="w-full py-2.5 rounded-lg text-sm font-semibold"
          style={{ background: email.trim() && password ? "var(--tb-brass)" : "var(--tb-surface-2)", color: email.trim() && password ? "var(--tb-bg)" : "var(--tb-muted)" }}
        >
          {loading ? "Please wait..." : mode === "signup" ? "Create account" : "Sign in"}
        </button>
        <button
          onClick={() => { setMode(mode === "signup" ? "signin" : "signup"); setError(null); }}
          className="w-full text-center tb-mono text-xs"
          style={{ color: "var(--tb-blue)" }}
        >
          {mode === "signup" ? "Already have an account? Sign in" : "New here? Create an account"}
        </button>
      </div>
    </CardShell>
  );
}

function LikeButton({ catchId }) {
  const [info, setInfo] = useState(null);
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    let alive = true;
    window.communityAPI.getLikeInfo(catchId)
      .then((i) => { if (alive) setInfo(i); })
      .catch(() => { if (alive) setInfo({ count: 0, liked: false }); });
    return () => { alive = false; };
  }, [catchId]);

  async function toggle() {
    if (!info || busy) return;
    haptic();
    setBusy(true);
    const before = info;
    setInfo({ count: Math.max(0, before.count + (before.liked ? -1 : 1)), liked: !before.liked });
    try {
      if (before.liked) await window.communityAPI.unlikeCatch(catchId);
      else await window.communityAPI.likeCatch(catchId);
    } catch (e) {
      setInfo(before);
    } finally {
      setBusy(false);
    }
  }

  const liked = !!(info && info.liked);
  return (
    <button
      onClick={toggle}
      className="flex items-center gap-1 tb-mono text-[11px]"
      style={{ color: liked ? "var(--tb-brass)" : "var(--tb-muted)" }}
    >
      <Heart size={14} fill={liked ? "currentColor" : "none"} />
      {info ? info.count : "–"}
    </button>
  );
}

function ProfileSheet({ user, onClose, onMessage }) {
  const isMe = !!window.communityAPI.uid && user.uid === window.communityAPI.uid;
  const [catches, setCatches] = useState(null);
  const [stats, setStats] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => {
    let alive = true;
    window.communityAPI.listUserCatches(user.uid)
      .then((d) => { if (alive) setCatches(d); })
      .catch(() => { if (alive) setError("Couldn't load this profile."); });
    window.communityAPI.getProfileStats(user.uid)
      .then((st) => { if (alive) setStats(st); })
      .catch(() => {});
    return () => { alive = false; };
  }, [user.uid]);

  async function toggleFollow() {
    if (!stats || busy || isMe) return;
    setBusy(true);
    setError(null);
    try {
      if (stats.isFollowing) {
        await window.communityAPI.unfollowUser(user.uid);
        setStats({ ...stats, isFollowing: false, followers: Math.max(0, stats.followers - 1) });
      } else {
        await window.communityAPI.followUser(user.uid);
        setStats({ ...stats, isFollowing: true, followers: stats.followers + 1 });
      }
    } catch (e) {
      setError("Couldn't update that — try again.");
    } finally {
      setBusy(false);
    }
  }

  async function toggleBlock() {
    if (busy || isMe) return;
    const already = isBlocked(user.uid);
    const ok = already || window.confirm(`Block ${user.nickname || "this angler"}? You won't see their posts, comments, chat, or messages, and they can't message you.`);
    if (!ok) return;
    setBusy(true);
    setError(null);
    try {
      if (already) await window.communityAPI.unblockUser(user.uid);
      else await window.communityAPI.blockUser(user.uid, user.nickname || "Angler");
      onClose();
    } catch (e) {
      setError("Couldn't update that — try again.");
      setBusy(false);
    }
  }

  const best = (catches || []).reduce((b, c) => {
    const lb = weightToLb(c.weight, c.weightUnit);
    return lb > b.lb ? { lb, c } : b;
  }, { lb: 0, c: null });

  return (
    <div
      className="tb-overlay absolute inset-0 z-40"
      style={{ background: "rgba(2,7,7,0.75)" }}
      onClick={onClose}
      onTouchStart={(e) => e.stopPropagation()}
      onTouchEnd={(e) => e.stopPropagation()}
    >
      <div
        className="tb-tray absolute bottom-0 left-0 right-0 rounded-t-2xl px-5 pt-4 pb-6"
        style={{ background: "var(--tb-bg)", border: "1px solid var(--tb-line)", maxHeight: "85%", overflowY: "auto" }}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-center justify-between mb-3">
          <div className="min-w-0">
            <h2 className="tb-stencil text-2xl truncate" style={{ color: "var(--tb-text)" }}>{user.nickname || "Angler"}</h2>
            {isMe && <div className="tb-mono text-[11px]" style={{ color: "var(--tb-brass)" }}>this is you</div>}
          </div>
          <button onClick={onClose}><X size={20} style={{ color: "var(--tb-muted)" }} /></button>
        </div>

        <div className="grid grid-cols-4 gap-2 mb-3">
          <StatTile label="Catches" value={catches ? catches.length : "–"} />
          <StatTile label="Followers" value={stats ? stats.followers : "–"} />
          <StatTile label="Following" value={stats ? stats.following : "–"} />
          <StatTile label="Best" value={best.c ? `${best.c.weight} ${best.c.weightUnit}` : "—"} small />
        </div>

        {!isMe && (
          <div className="flex gap-3 mb-3">
            <button
              onClick={toggleFollow}
              disabled={!stats || busy}
              className="flex-1 py-2.5 rounded-lg text-sm font-semibold"
              style={{
                background: stats && stats.isFollowing ? "var(--tb-surface-2)" : "var(--tb-brass)",
                color: stats && stats.isFollowing ? "var(--tb-text)" : "var(--tb-bg)",
                border: "1px solid var(--tb-line)",
              }}
            >
              {busy ? "..." : stats && stats.isFollowing ? "Following ✓" : "Follow"}
            </button>
            <button
              onClick={() => onMessage({ uid: user.uid, nickname: user.nickname || "Angler" })}
              className="flex-1 py-2.5 rounded-lg text-sm font-semibold"
              style={{ background: "var(--tb-surface-2)", color: "var(--tb-text)", border: "1px solid var(--tb-line)" }}
            >
              Message
            </button>
          </div>
        )}

        {!isMe && (
          <div className="flex justify-center mb-3">
            <button onClick={toggleBlock} className="tb-mono text-[11px]" style={{ color: "var(--tb-muted)" }}>
              {isBlocked(user.uid) ? "Unblock this angler" : "Block this angler"}
            </button>
          </div>
        )}

        {error && <div className="tb-mono text-xs mb-2" style={{ color: "var(--tb-flare)" }}>{error}</div>}

        <div className="tb-mono text-[10px] mb-1.5" style={{ color: "var(--tb-brass)" }}>RECENT CATCHES</div>
        {catches === null && !error && <div className="tb-mono text-xs" style={{ color: "var(--tb-muted)" }}>Loading...</div>}
        {catches && catches.length === 0 && <div className="tb-mono text-xs" style={{ color: "var(--tb-muted)" }}>No shared catches yet.</div>}
        <div className="space-y-2">
          {(catches || []).slice(0, 10).map((c) => (
            <div key={c.id} className="rounded-lg p-2.5 flex gap-3" style={{ background: "var(--tb-surface-2)", border: "1px solid var(--tb-line)" }}>
              {c.photo && <img src={c.photo} alt="" className="w-12 h-12 rounded-lg object-cover shrink-0" />}
              <div className="min-w-0">
                <div className="text-sm font-semibold" style={{ color: "var(--tb-text)" }}>{c.species || "Unknown species"}</div>
                <div className="tb-mono text-[11px]" style={{ color: "var(--tb-muted)" }}>
                  {[
                    c.length ? `${c.length} ${c.lengthUnit}` : null,
                    c.weight ? `${c.weight} ${c.weightUnit}` : null,
                    c.lure || null,
                  ].filter(Boolean).join(" · ")}
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function MessagesView({ target, onOpen }) {
  const [threads, setThreads] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    if (target) return undefined;
    let alive = true;
    setThreads(null);
    window.communityAPI.listThreads()
      .then((t) => { if (alive) setThreads(t); })
      .catch(() => { if (alive) setError("Couldn't load your messages."); });
    return () => { alive = false; };
  }, [target]);

  if (target) return <DMThread other={target} onBack={() => onOpen(null)} />;

  return (
    <CardShell title="MESSAGES" subtitle="private — only you and the other angler can read these">
      {error && <div className="tb-mono text-xs" style={{ color: "var(--tb-flare)" }}>{error}</div>}
      {!error && threads === null && <div className="tb-mono text-xs" style={{ color: "var(--tb-muted)" }}>Loading...</div>}
      {!error && threads && threads.length === 0 && (
        <EmptyState text="No conversations yet — tap an angler's name anywhere in Community and choose Message." />
      )}
      <div className="space-y-2">
        {(threads || []).filter((t) => !isBlocked(t.otherUid)).map((t) => (
          <button
            key={t.id}
            onClick={() => onOpen({ uid: t.otherUid, nickname: t.otherNickname || "Angler" })}
            className="w-full text-left rounded-lg px-3 py-2.5"
            style={{ background: "var(--tb-surface-2)", border: "1px solid var(--tb-line)" }}
          >
            <div className="flex items-center justify-between gap-2">
              <span className="text-sm font-semibold truncate" style={{ color: "var(--tb-text)" }}>{t.otherNickname || "Angler"}</span>
              <span className="tb-mono text-[10px] shrink-0" style={{ color: "var(--tb-muted)" }}>{formatCommentTime(t.updatedAt)}</span>
            </div>
            <div className="tb-mono text-[11px] truncate" style={{ color: "var(--tb-muted)" }}>{t.lastText}</div>
          </button>
        ))}
      </div>
    </CardShell>
  );
}

function DMThread({ other, onBack }) {
  const [messages, setMessages] = useState(null);
  const [error, setError] = useState(null);
  const [text, setText] = useState("");
  const [sending, setSending] = useState(false);
  const endRef = useRef(null);

  useEffect(() => {
    const unsubscribe = window.communityAPI.subscribeDM(
      other.uid,
      (msgs) => { setMessages(msgs); setError(null); },
      () => setError("Couldn't open this conversation.")
    );
    return () => { if (typeof unsubscribe === "function") unsubscribe(); };
  }, [other.uid]);

  useEffect(() => {
    if (endRef.current) endRef.current.scrollIntoView({ block: "end" });
  }, [messages]);

  async function send() {
    const clean = text.trim();
    if (!clean || sending) return;
    setSending(true);
    try {
      await window.communityAPI.sendDM(other.uid, other.nickname, clean);
      setText("");
    } catch (e) {
      setError("Message didn't send — try again.");
    } finally {
      setSending(false);
    }
  }

  return (
    <CardShell title={`Chat with ${other.nickname || "Angler"}`} subtitle="private conversation">
      <button onClick={onBack} className="tb-mono text-[11px] mb-2" style={{ color: "var(--tb-blue)" }}>← All messages</button>
      <div className="rounded-lg p-2 space-y-2 overflow-y-auto tb-scroll" style={{ height: "320px", background: "var(--tb-surface-2)", border: "1px solid var(--tb-line)" }}>
        {messages === null && !error && <div className="tb-mono text-xs" style={{ color: "var(--tb-muted)" }}>Opening...</div>}
        {messages && messages.length === 0 && <div className="tb-mono text-xs" style={{ color: "var(--tb-muted)" }}>No messages yet — say hi.</div>}
        {(messages || []).filter((m) => !isBlocked(m.uid)).map((m) => {
          const mine = window.communityAPI.uid && m.uid === window.communityAPI.uid;
          return (
            <div key={m.id} className={mine ? "flex flex-col items-end" : "flex flex-col items-start"}>
              <div
                className="rounded-xl px-3 py-1.5 text-xs break-words"
                style={{
                  maxWidth: "85%",
                  background: mine ? "var(--tb-brass)" : "var(--tb-surface)",
                  color: mine ? "var(--tb-bg)" : "var(--tb-text)",
                  border: mine ? "none" : "1px solid var(--tb-line)",
                }}
              >
                {m.text}
              </div>
              <div className="tb-mono text-[10px] mt-0.5 flex gap-2" style={{ color: "var(--tb-muted)" }}>
                <span>{formatCommentTime(m.createdAt)}</span>
                {!mine && <ReportButton kind="dm" path={`dms/${m.id}`} excerpt={m.text} />}
              </div>
            </div>
          );
        })}
        <div ref={endRef} />
      </div>
      {error && <div className="tb-mono text-xs mt-2" style={{ color: "var(--tb-flare)" }}>{error}</div>}
      <div className="flex gap-2 mt-2">
        <input
          value={text}
          onChange={(e) => setText(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && send()}
          maxLength={1000}
          placeholder={`Message ${other.nickname || "Angler"}...`}
          className="flex-1 min-w-0 rounded-lg py-2.5 px-3 text-sm outline-none"
          style={{ background: "var(--tb-surface-2)", color: "var(--tb-text)", border: "1px solid var(--tb-line)" }}
        />
        <button
          onClick={send}
          disabled={!text.trim() || sending}
          className="px-4 rounded-lg text-xs tb-mono font-semibold shrink-0"
          style={{ background: text.trim() ? "var(--tb-brass)" : "var(--tb-surface-2)", color: text.trim() ? "var(--tb-bg)" : "var(--tb-muted)" }}
        >
          Send
        </button>
      </div>
    </CardShell>
  );
}

function BlockedUsersCard() {
  const [open, setOpen] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const list = (window.communityAPI && window.communityAPI.blockList) || [];
  if (list.length === 0) return null;

  async function unblock(uid) {
    setBusyId(uid);
    try {
      await window.communityAPI.unblockUser(uid);
    } catch (e) {
      // leave the list as is
    } finally {
      setBusyId(null);
    }
  }

  return (
    <div className="pt-2">
      <button onClick={() => setOpen((v) => !v)} className="tb-mono text-[11px] block mx-auto" style={{ color: "var(--tb-muted)" }}>
        {open ? "Hide blocked anglers" : `Blocked anglers (${list.length})`}
      </button>
      {open && (
        <div className="mt-2 space-y-2">
          {list.map((b) => (
            <div key={b.uid} className="flex items-center justify-between rounded-lg px-3 py-2" style={{ background: "var(--tb-surface-2)", border: "1px solid var(--tb-line)" }}>
              <span className="text-sm" style={{ color: "var(--tb-text)" }}>{b.nickname}</span>
              <button onClick={() => unblock(b.uid)} disabled={busyId === b.uid} className="tb-mono text-[11px]" style={{ color: "var(--tb-blue)" }}>
                {busyId === b.uid ? "..." : "Unblock"}
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function DeleteAccountCard({ onDeleted }) {
  const [open, setOpen] = useState(false);
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  async function confirmDelete() {
    if (!password || busy) return;
    setBusy(true);
    setError(null);
    const result = await window.communityAPI.deleteAccount(password);
    setBusy(false);
    if (result.error) {
      setError(result.error);
    } else {
      onDeleted();
    }
  }

  if (!open) {
    return (
      <div className="pt-2 text-center">
        <button onClick={() => setOpen(true)} className="tb-mono text-[11px]" style={{ color: "var(--tb-muted)" }}>
          Delete my account
        </button>
      </div>
    );
  }

  return (
    <CardShell title="DELETE ACCOUNT" subtitle="this can't be undone">
      <p className="text-xs leading-relaxed mb-3" style={{ color: "var(--tb-muted)" }}>
        This permanently deletes your Community account and removes your shared catches, spots, chat messages,
        and comments. Your private tackle box and catch log stay on this device.
      </p>
      <input
        type="password"
        value={password}
        onChange={(e) => setPassword(e.target.value)}
        onKeyDown={(e) => e.key === "Enter" && confirmDelete()}
        placeholder="Enter your password to confirm"
        className="w-full rounded-lg py-2.5 px-3 text-sm outline-none"
        style={{ background: "var(--tb-surface-2)", color: "var(--tb-text)", border: "1px solid var(--tb-line)" }}
      />
      {error && <div className="tb-mono text-xs mt-2" style={{ color: "var(--tb-flare)" }}>{error}</div>}
      <div className="flex gap-3 mt-3">
        <button
          onClick={() => { setOpen(false); setPassword(""); setError(null); }}
          className="flex-1 py-2.5 rounded-lg text-sm font-semibold"
          style={{ background: "var(--tb-surface-2)", color: "var(--tb-text)" }}
        >
          Cancel
        </button>
        <button
          onClick={confirmDelete}
          disabled={!password || busy}
          className="flex-1 py-2.5 rounded-lg text-sm font-semibold"
          style={{ background: password ? "var(--tb-flare)" : "var(--tb-surface-2)", color: password ? "var(--tb-bg)" : "var(--tb-muted)" }}
        >
          {busy ? "Deleting..." : "Delete forever"}
        </button>
      </div>
    </CardShell>
  );
}

function CommunityView() {
  const [sub, setSub] = useState("feed"); // feed | chat | messages | map | spots | leaderboard
  const [profile, setProfile] = useState(null); // { uid, nickname } of the profile sheet
  const [dmTarget, setDmTarget] = useState(null); // { uid, nickname } of the open conversation
  const [, setBlocksTick] = useState(0);

  useEffect(() => {
    const bump = () => setBlocksTick((t) => t + 1);
    window.addEventListener("community-blocks", bump);
    return () => window.removeEventListener("community-blocks", bump);
  }, []);
  const [ready, setReady] = useState(!!(typeof window !== "undefined" && window.communityAPI && window.communityAPI.ready));
  const [signedIn, setSignedIn] = useState(!!(typeof window !== "undefined" && window.communityAPI && window.communityAPI.signedIn));
  const configured = typeof window !== "undefined" && window.communityAPI && window.communityAPI.configured;
  const [nickname, setNicknameState] = useState(() => (configured ? window.communityAPI.getNickname() : "Angler"));
  const [editingNickname, setEditingNickname] = useState(false);
  const [nicknameDraft, setNicknameDraft] = useState(nickname);

  useEffect(() => {
    if (!configured) return;
    function onChange() {
      setReady(window.communityAPI.ready);
      setSignedIn(window.communityAPI.signedIn);
      setNicknameState(window.communityAPI.getNickname());
    }
    window.addEventListener("community-ready", onChange);
    const t = setTimeout(() => {
      if (window.communityAPI && window.communityAPI.ready) onChange();
    }, 1500);
    return () => {
      window.removeEventListener("community-ready", onChange);
      clearTimeout(t);
    };
  }, [configured]);

  function saveNickname() {
    const name = nicknameDraft.trim() || "Angler";
    window.communityAPI.setNickname(name);
    setNicknameState(name);
    setEditingNickname(false);
  }

  async function handleSignOut() {
    await window.communityAPI.signOutUser();
    setSignedIn(false);
  }

  if (!configured) {
    return (
      <div className="py-10 text-center space-y-3">
        <Waves size={30} className="mx-auto" style={{ color: "var(--tb-brass)" }} />
        <p className="text-sm px-4" style={{ color: "var(--tb-muted)" }}>
          Community features need a one-time setup by whoever's hosting this app
          (a free Firebase project). Ask them to finish that step, then this tab
          will light up for everyone.
        </p>
      </div>
    );
  }

  if (!ready) {
    return <div className="py-16 text-center" style={{ color: "var(--tb-muted)" }}>Connecting to the community...</div>;
  }

  if (!signedIn) {
    return <CommunityAuthForm onSignedIn={() => setSignedIn(true)} />;
  }

  return (
    <div className="space-y-3">
      <div className="flex items-center justify-between">
        <div className="flex gap-2 overflow-x-auto tb-scroll" style={{ scrollbarWidth: "none" }}>
          <TabButton active={sub === "feed"} onClick={() => setSub("feed")} label="Feed" />
          <TabButton active={sub === "chat"} onClick={() => setSub("chat")} label="Chat" />
          <TabButton active={sub === "messages"} onClick={() => setSub("messages")} label="DMs" />
          <TabButton active={sub === "map"} onClick={() => setSub("map")} label="Map" />
          <TabButton active={sub === "spots"} onClick={() => setSub("spots")} label="Spots" />
          <TabButton active={sub === "leaderboard"} onClick={() => setSub("leaderboard")} label="Ranks" />
        </div>
      </div>

      <CardShell title="YOUR ANGLER NAME">
        {editingNickname ? (
          <div className="flex gap-2">
            <input
              autoFocus
              value={nicknameDraft}
              onChange={(e) => setNicknameDraft(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && saveNickname()}
              className="flex-1 rounded-lg py-2 px-3 text-sm outline-none"
              style={{ background: "var(--tb-surface-2)", color: "var(--tb-text)", border: "1px solid var(--tb-line)" }}
            />
            <button onClick={saveNickname} className="px-3 rounded-lg text-xs tb-mono font-semibold" style={{ background: "var(--tb-brass)", color: "var(--tb-bg)" }}>Save</button>
          </div>
        ) : (
          <div className="flex items-center justify-between">
            <button onClick={() => { setNicknameDraft(nickname); setEditingNickname(true); }} className="flex items-center gap-2 flex-1 min-w-0">
              <span className="text-sm font-semibold truncate" style={{ color: "var(--tb-text)" }}>{nickname}</span>
              <span className="tb-mono text-[11px] shrink-0" style={{ color: "var(--tb-blue)" }}>Change</span>
            </button>
            <button onClick={handleSignOut} className="tb-mono text-[11px] shrink-0 ml-3" style={{ color: "var(--tb-muted)" }}>Sign out</button>
          </div>
        )}
      </CardShell>

      {sub === "feed" && <CommunityFeed onOpenProfile={setProfile} />}
      {sub === "chat" && <CommunityChat onOpenProfile={setProfile} />}
      {sub === "messages" && <MessagesView target={dmTarget} onOpen={setDmTarget} />}
      {sub === "map" && <CommunityMap />}
      {sub === "spots" && <CommunitySpots onOpenProfile={setProfile} />}
      {sub === "leaderboard" && <CommunityLeaderboard />}
      {profile && (
        <ProfileSheet
          user={profile}
          onClose={() => setProfile(null)}
          onMessage={(u) => { setProfile(null); setDmTarget(u); setSub("messages"); }}
        />
      )}
      <BlockedUsersCard />
      <DeleteAccountCard onDeleted={() => setSignedIn(false)} />
    </div>
  );
}

function CommunityFeed({ onOpenProfile }) {
  const [scope, setScope] = useState("all"); // all | following
  const [catches, setCatches] = useState(null);
  const [error, setError] = useState(null);
  const [lightboxSrc, setLightboxSrc] = useState(null);

  const load = useCallback(async () => {
    setError(null);
    try {
      if (scope === "following") {
        const [data, uids] = await Promise.all([
          window.communityAPI.listCatches(100),
          window.communityAPI.getFollowingUids(),
        ]);
        const followed = new Set(uids);
        setCatches(data.filter((c) => followed.has(c.uid)));
      } else {
        setCatches(await window.communityAPI.listCatches(30));
      }
    } catch (e) {
      setError("Couldn't load the community feed right now.");
    }
  }, [scope]);

  useEffect(() => { load(); }, [load]);

  async function handleDelete(id) {
    try {
      await window.communityAPI.deleteCatch(id);
      setCatches((prev) => prev.filter((c) => c.id !== id));
    } catch (e) {
      // ignore
    }
  }

  const shown = catches ? catches.filter((c) => !isBlocked(c.uid)) : null;

  return (
    <CardShell title="RECENT CATCHES" subtitle="shared by everyone using this app">
      <div className="flex justify-between items-center mb-2">
        <div className="flex gap-2">
          <TabButton active={scope === "all"} onClick={() => { setCatches(null); setScope("all"); }} label="Everyone" />
          <TabButton active={scope === "following"} onClick={() => { setCatches(null); setScope("following"); }} label="Following" />
        </div>
        <button onClick={load} className="w-7 h-7 rounded-md flex items-center justify-center" style={{ background: "var(--tb-surface-2)" }}>
          <RefreshCw size={13} style={{ color: "var(--tb-muted)" }} />
        </button>
      </div>
      {error && <div className="tb-mono text-xs" style={{ color: "var(--tb-flare)" }}>{error}</div>}
      {!error && catches === null && <div className="tb-mono text-xs" style={{ color: "var(--tb-muted)" }}>Loading feed...</div>}
      {!error && shown && shown.length === 0 && (
        <EmptyState text={scope === "following" ? "Nothing here yet — tap an angler's name and follow them to fill this feed." : "No shared catches yet — be the first from the Catches tab."} />
      )}
      {!error && shown && shown.length > 0 && (
        <div className="space-y-2">
          {shown.map((c) => {
            const dt = c.dateTime ? new Date(c.dateTime) : null;
            const mine = window.communityAPI.uid && c.uid === window.communityAPI.uid;
            return (
              <div key={c.id} className="rounded-lg p-3 flex gap-3" style={{ background: "var(--tb-surface-2)", border: "1px solid var(--tb-line)" }}>
                {c.photo && (
                  <img
                    src={c.photo}
                    alt=""
                    onClick={() => setLightboxSrc(c.photo)}
                    className="w-14 h-14 rounded-lg object-cover shrink-0"
                    style={{ border: "1px solid var(--tb-line)" }}
                  />
                )}
                <div className="flex-1 min-w-0">
                  <div className="flex items-center justify-between">
                    <span className="text-sm font-semibold" style={{ color: "var(--tb-text)" }}>{c.species || "Unknown species"}</span>
                    <button
                      onClick={() => onOpenProfile && onOpenProfile({ uid: c.uid, nickname: c.nickname || "Angler" })}
                      className="tb-mono text-[10px] shrink-0 ml-2"
                      style={{ color: "var(--tb-brass)", textDecoration: "underline" }}
                    >
                      {c.nickname || "Angler"}
                    </button>
                  </div>
                  <div className="tb-mono text-[11px] mt-0.5" style={{ color: "var(--tb-muted)" }}>
                    {[
                      c.length ? `${c.length} ${c.lengthUnit}` : null,
                      c.weight ? `${c.weight} ${c.weightUnit}` : null,
                      dt ? dt.toLocaleDateString([], { month: "short", day: "numeric" }) : null,
                    ].filter(Boolean).join(" · ")}
                  </div>
                  {(c.lure || c.location) && (
                    <div className="tb-mono text-[11px] mt-1" style={{ color: "var(--tb-blue)" }}>
                      {[c.lure, c.location].filter(Boolean).join(" · ")}
                    </div>
                  )}
                  {mine && (
                    <button onClick={() => handleDelete(c.id)} className="tb-mono text-[10px] mt-1.5" style={{ color: "var(--tb-flare)" }}>
                      Remove my post
                    </button>
                  )}
                  <div className="mt-2"><LikeButton catchId={c.id} /></div>
                  <CommentThread parentCol="community_catches" parentId={c.id} onOpenProfile={onOpenProfile} />
                </div>
              </div>
            );
          })}
        </div>
      )}
      {lightboxSrc && <PhotoLightbox src={lightboxSrc} onClose={() => setLightboxSrc(null)} />}
    </CardShell>
  );
}

function isBlocked(uid) {
  return !!(uid && window.communityAPI && window.communityAPI.blocked && window.communityAPI.blocked.has(uid));
}

function formatCommentTime(ts) {
  try {
    const d = ts && typeof ts.toDate === "function" ? ts.toDate() : ts ? new Date(ts) : null;
    if (!d || Number.isNaN(d.getTime())) return "";
    const sameDay = d.toDateString() === new Date().toDateString();
    return sameDay
      ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
      : d.toLocaleDateString([], { month: "short", day: "numeric" });
  } catch (e) {
    return "";
  }
}

function ReportButton({ kind, path, excerpt }) {
  const [state, setState] = useState("idle"); // idle | sending | done
  async function send() {
    if (state !== "idle") return;
    setState("sending");
    try {
      await window.communityAPI.report(kind, path, excerpt, "reported by user");
      setState("done");
    } catch (e) {
      setState("idle");
    }
  }
  return (
    <button onClick={send} disabled={state !== "idle"} className="tb-mono text-[10px]" style={{ color: "var(--tb-muted)" }}>
      {state === "done" ? "Reported ✓" : state === "sending" ? "..." : "Report"}
    </button>
  );
}

function CommentThread({ parentCol, parentId, onOpenProfile }) {
  const [open, setOpen] = useState(false);
  const [comments, setComments] = useState(null);
  const [text, setText] = useState("");
  const [sending, setSending] = useState(false);
  const [error, setError] = useState(null);

  const load = useCallback(async () => {
    setError(null);
    try {
      setComments(await window.communityAPI.listComments(parentCol, parentId));
    } catch (e) {
      setError("Couldn't load comments.");
    }
  }, [parentCol, parentId]);

  useEffect(() => {
    if (open && comments === null) load();
  }, [open, comments, load]);

  async function submit() {
    const clean = text.trim();
    if (!clean || sending) return;
    setSending(true);
    setError(null);
    try {
      await window.communityAPI.addComment(parentCol, parentId, clean);
      setText("");
      await load();
    } catch (e) {
      setError("Couldn't post that — try again.");
    } finally {
      setSending(false);
    }
  }

  async function remove(id) {
    try {
      await window.communityAPI.deleteComment(parentCol, parentId, id);
      setComments((prev) => (prev || []).filter((c) => c.id !== id));
    } catch (e) {
      setError("Couldn't delete that comment.");
    }

  const count = comments ? comments.length : null;

    <div className="mt-2">
      <button onClick={() => setOpen((v) => !v)} className="tb-mono text-[11px]" style={{ color: "var(--tb-blue)" }}>
        {open ? "Hide comments" : count ? `Comments (${count})` : "Comments"}

        <div className="mt-2 space-y-2">

          {comments && comments.length === 0 && (
            <div className="tb-mono text-[11px]" style={{ color: "var(--tb-muted)" }}>No comments yet — start the conversation.</div>

                <div className="flex items-center justify-between gap-2">

                    className="tb-mono text-[10px]"
                    style={{ color: "var(--tb-brass)", textDecoration: "underline" }}
                  >
                    {cm.nickname || "Angler"}
                  </button>
                  <span className="tb-mono text-[10px]" style={{ color: "var(--tb-muted)" }}>{formatCommentTime(cm.createdAt)}</span>
                </div>
                <div className="text-xs mt-0.5 break-words" style={{ color: "var(--tb-text)" }}>{cm.text}</div>
                <div className="mt-1">
                  {mine ? (
                    <button onClick={() => remove(cm.id)} className="tb-mono text-[10px]" style={{ color: "var(--tb-flare)" }}>Delete</button>
                  ) : (
                    <ReportButton kind="comment" path={`${parentCol}/${parentId}/comments/${cm.id}`} excerpt={cm.text} />
                  )}
                </div>
              </div>
            );
          })}

          <div className="flex gap-2">
            <input
              value={text}
              onChange={(e) => setText(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && submit()}

              placeholder="Add a comment..."
              className="flex-1 min-w-0 rounded-lg py-2 px-3 text-xs outline-none"
              style={{ background: "var(--tb-surface)", color: "var(--tb-text)", border: "1px solid var(--tb-line)" }}
            />
            <button
              onClick={submit}
              disabled={!text.trim() || sending}
              className="px-3 rounded-lg text-xs tb-mono font-semibold shrink-0"
              style={{ background: text.trim() ? "var(--tb-brass)" : "var(--tb-surface)", color: text.trim() ? "var(--tb-bg)" : "var(--tb-muted)" }}
            >
              {sending ? "..." : "Post"}
            </button>
          </div>
          {error && <div className="tb-mono text-[11px]" style={{ color: "var(--tb-flare)" }}>{error}</div>}
        </div>
      )}
    </div>
  );
}

function CommunityMap() {
  const mapRef = useRef(null);
  const mapInstance = useRef(null);
  const markersRef = useRef([]);
  const [catches, setCatches] = useState(null);
  const [error, setError] = useState(null);
  const leafletAvailable = typeof window !== "undefined" && !!window.L;

  const load = useCallback(async () => {
    setError(null);
    try {
      const data = await window.communityAPI.listCatches(100);
      setCatches(data.filter((c) => typeof c.lat === "number" && typeof c.lon === "number" && !isBlocked(c.uid)));
    } catch (e) {
      setError("Couldn't load the community map right now.");
    }
  }, []);

  useEffect(() => { load(); }, [load]);

  useEffect(() => {
    if (!leafletAvailable || !mapRef.current || mapInstance.current) return;
    mapInstance.current = window.L.map(mapRef.current, { attributionControl: true }).setView([30, -20], 2);
    window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors",
      maxZoom: 17,
    }).addTo(mapInstance.current);
    return () => {
      if (mapInstance.current) {
        mapInstance.current.remove();
        mapInstance.current = null;
      }
    };
  }, [leafletAvailable]);

  useEffect(() => {
    if (!mapInstance.current || !catches) return;
    markersRef.current.forEach((m) => mapInstance.current.removeLayer(m));
    markersRef.current = [];
    if (catches.length === 0) return;

    catches.forEach((c) => {
      const marker = window.L.marker([c.lat, c.lon]).addTo(mapInstance.current);
      const label = [c.species || "Catch", c.nickname ? `by ${c.nickname}` : null, c.weight ? `${c.weight} ${c.weightUnit}` : null]
        .filter(Boolean)
        .join(" — ");
      marker.bindPopup(label);
      markersRef.current.push(marker);
    });

    const group = window.L.featureGroup(markersRef.current);
    mapInstance.current.fitBounds(group.getBounds().pad(0.4), { maxZoom: 10 });
  }, [catches]);

  if (!leafletAvailable) {
    return (
      <CardShell title="CATCH MAP">
        <div className="tb-mono text-xs" style={{ color: "var(--tb-muted)" }}>
          The map needs the installed app to load — not available in this preview.
        </div>
      </CardShell>
    );
  }

  return (
    <CardShell title="CATCH MAP" subtitle="only catches with an approximate shared location appear here">
      <div className="flex justify-end mb-2">
        <button onClick={load} className="w-7 h-7 rounded-md flex items-center justify-center" style={{ background: "var(--tb-surface-2)" }}>
          <RefreshCw size={13} style={{ color: "var(--tb-muted)" }} />
        </button>
      </div>
      {error && <div className="tb-mono text-xs mb-2" style={{ color: "var(--tb-flare)" }}>{error}</div>}
      {!error && catches && catches.length === 0 && (
        <EmptyState text="No catches with a shared location yet — check the box for it next time you post one." />
      )}
      <div
        ref={mapRef}
        style={{
          height: "320px",
          borderRadius: "12px",
          overflow: "hidden",
          display: !error && catches && catches.length > 0 ? "block" : "none",
        }}
      />
    </CardShell>
  );
}

function AddSpotForm({ onCancel, onSaved }) {
  const [name, setName] = useState("");
  const [notes, setNotes] = useState("");
  const [photo, setPhoto] = useState(null);
  const [gps, setGps] = useState(null);
  const [gpsStatus, setGpsStatus] = useState("idle");
  const [saving, setSaving] = useState(false);

  const captureGps = useCallback(() => {
    if (!navigator.geolocation) {
      setGpsStatus("error");
      return;
    }
    setGpsStatus("locating");
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        setGps({ lat: pos.coords.latitude, lon: pos.coords.longitude });
        setGpsStatus("ok");
      },
      () => setGpsStatus("error"),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }, []);

  useEffect(() => { captureGps(); }, [captureGps]);

  async function submit() {
    if (!name.trim() || saving) return;
    setSaving(true);
    try {
      await window.communityAPI.addSpot({
        name: name.trim(),
        notes: notes.trim(),
        photo: photo || null,
        lat: gps ? gps.lat : null,
        lon: gps ? gps.lon : null,
      });
      onSaved();
    } catch (e) {
      setSaving(false);
    }
  }

  const inputStyle = { background: "var(--tb-surface-2)", color: "var(--tb-text)", border: "1px solid var(--tb-line)" };

  return (
    <div className="tb-overlay absolute inset-0 z-30" style={{ background: "rgba(10,16,19,0.65)" }}>
      <div className="tb-tray absolute bottom-0 left-0 right-0 rounded-t-2xl px-5 pt-4 pb-6" style={{ background: "var(--tb-bg)", border: "1px solid var(--tb-line)", maxHeight: "80%", overflowY: "auto" }}>
        <div className="flex items-center justify-between mb-4">
          <h2 className="tb-stencil text-xl" style={{ color: "var(--tb-text)" }}>ADD A SPOT</h2>
          <button onClick={onCancel}><X size={20} style={{ color: "var(--tb-muted)" }} /></button>
        </div>
        <div className="space-y-3">
          <Field label="Spot name">
            <input autoFocus value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. North Cove boat ramp" className="w-full rounded-lg py-2 px-3 text-sm outline-none" style={inputStyle} />
          </Field>
          <PhotoField photo={photo} onChange={setPhoto} label="Photo (optional)" />
          <Field label="Notes (optional)">
            <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={2} placeholder="What's good here, access tips, etc." className="w-full rounded-lg py-2 px-3 text-sm outline-none resize-none" style={inputStyle} />
          </Field>
          <Field label="Location">
            {gpsStatus === "locating" && (
              <div className="flex items-center gap-2 text-xs tb-mono rounded-lg py-2 px-3" style={inputStyle}>
                <RefreshCw size={13} className="tb-spin" style={{ color: "var(--tb-muted)" }} />
                <span style={{ color: "var(--tb-muted)" }}>Finding your location...</span>
              </div>
            )}
            {gpsStatus === "ok" && gps && (
              <div className="text-xs tb-mono rounded-lg py-2 px-3" style={inputStyle}>
                <span style={{ color: "var(--tb-text)" }}>{gps.lat.toFixed(4)}, {gps.lon.toFixed(4)}</span>
              </div>
            )}
            {gpsStatus === "error" && (
              <div className="flex items-center justify-between text-xs tb-mono rounded-lg py-2 px-3" style={inputStyle}>
                <span style={{ color: "var(--tb-muted)" }}>No location — spot will save without a pin.</span>
                <button type="button" onClick={captureGps} style={{ color: "var(--tb-brass)" }}>Try again</button>
              </div>
            )}
          </Field>
        </div>
        <div className="flex gap-3 mt-5">
          <button onClick={onCancel} className="flex-1 py-2.5 rounded-lg text-sm font-semibold" style={{ background: "var(--tb-surface-2)", color: "var(--tb-text)" }}>Cancel</button>
          <button onClick={submit} disabled={!name.trim() || saving} className="flex-1 py-2.5 rounded-lg text-sm font-semibold" style={{ background: name.trim() ? "var(--tb-brass)" : "var(--tb-surface-2)", color: name.trim() ? "var(--tb-bg)" : "var(--tb-muted)" }}>
            {saving ? "Saving..." : "Add spot"}
          </button>
        </div>
      </div>
    </div>
  );
}

            </div>
          ))}
        </div>
      )}
    </CardShell>
  );
}

  const filtered = category === "all" ? KNOTS : KNOTS.filter((k) => k.category === category);

  function toggle(id) {

  return (
