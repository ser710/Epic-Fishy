// Pure helper: bucket projected points into pixel cells. Exported for testing.
function proCluster(points, project, cell) {
  const buckets = new Map();
  for (const p of points) {
    const pt = project(p);
    const key = Math.floor(pt.x / cell) + ":" + Math.floor(pt.y / cell);
    let b = buckets.get(key);
    if (!b) { b = { items: [], sx: 0, sy: 0, lat: 0, lon: 0 }; buckets.set(key, b); }
    b.items.push(p); b.lat += p.lat; b.lon += p.lon;
  }
  return [...buckets.values()].map((b) => ({ items: b.items, lat: b.lat / b.items.length, lon: b.lon / b.items.length }));
}
// Snap a (already fuzzed) shared coordinate to a ~1 km grid so repeat posts can't be averaged back to an exact spot.
function proSnapShared(lat, lon) {
  return { lat: Math.round(lat * 100) / 100, lon: Math.round(lon * 100) / 100 };
}

function proCatchPopup(c) {
  const wrap = document.createElement("div");
  wrap.style.cssText = "min-width:150px;max-width:210px;font:13px/1.35 system-ui,sans-serif;color:#0b1a18";
  const add = (txt, css) => { const d = document.createElement("div"); d.textContent = txt; if (css) d.style.cssText = css; wrap.appendChild(d); };
  if (typeof c.photo === "string" && c.photo.startsWith("data:image/")) {
    const img = document.createElement("img");
    img.src = c.photo; img.alt = ""; img.style.cssText = "width:100%;max-height:120px;object-fit:cover;border-radius:8px;margin-bottom:6px";
    wrap.appendChild(img);
  }
  add(c.species || "Catch", "font-weight:700;font-size:14px");
  const size = [c.length ? `${c.length} ${c.lengthUnit || ""}`.trim() : null, c.weight ? `${c.weight} ${c.weightUnit || ""}`.trim() : null].filter(Boolean).join(" · ");
  if (size) add(size);
  if (c.lure) add("on " + c.lure, "color:#35514d");
  if (c.nickname) add("by " + c.nickname, "color:#35514d");
  if (c.dateTime) { const d = new Date(c.dateTime); if (Number.isFinite(d.getTime())) add(d.toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" }), "color:#6a807c;font-size:12px"); }
  return wrap;
}

function ProCommunityMap() {
  const mapRef = useRef(null);
  const mapInstance = useRef(null);
  const layerRef = useRef(null);
  const [all, setAll] = useState(null);
  const [error, setError] = useState(null);
  const [filter, setFilter] = useState("");
  const [shown, setShown] = useState(0);
  const leafletAvailable = typeof window !== "undefined" && !!window.L;

  const load = useCallback(async () => {
    setError(null);
    try {
      const data = await window.communityAPI.listCatches(250);
      setAll(data.filter((c) => typeof c.lat === "number" && typeof c.lon === "number" && !isBlocked(c.uid)));
    } catch (e) {
      setError("Couldn't load the community map right now.");
    }
  }, []);
  useEffect(() => { load(); }, [load]);

  const speciesChips = useMemo(() => {
    const m = {};
    (all || []).forEach((c) => { if (c.species) m[c.species] = (m[c.species] || 0) + 1; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 8).map((e) => e[0]);
  }, [all]);

  const visible = useMemo(() => (all || []).filter((c) => !filter || c.species === filter), [all, filter]);

  useEffect(() => {
    if (!leafletAvailable || !mapRef.current || mapInstance.current) return undefined;
    const map = window.L.map(mapRef.current, { attributionControl: true, worldCopyJump: true }).setView([30, -20], 2);
    proBaseMap(window.L, map, 17);
    layerRef.current = window.L.layerGroup().addTo(map);
    mapInstance.current = map;
    return () => { map.remove(); mapInstance.current = null; layerRef.current = null; };
  }, [leafletAvailable]);

  const draw = useCallback(() => {
    const map = mapInstance.current, layer = layerRef.current;
    if (!map || !layer) return;
    layer.clearLayers();
    const L = window.L;
    const clusters = proCluster(visible, (p) => map.latLngToLayerPoint([p.lat, p.lon]), 54);
    clusters.forEach((cl) => {
      if (cl.items.length === 1) {
        const c = cl.items[0];
        L.circleMarker([c.lat, c.lon], { radius: 9, color: "#040707", weight: 2, fillColor: "#2dd4bf", fillOpacity: 1 }).bindPopup(() => proCatchPopup(c)).addTo(layer);
      } else {
        const n = cl.items.length;
        const size = n > 99 ? 46 : n > 9 ? 40 : 34;
        const icon = L.divIcon({ className: "", iconSize: [size, size], html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:#2dd4bf;color:#040707;border:3px solid rgba(4,7,7,.85);display:flex;align-items:center;justify-content:center;font:700 14px system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.5)">${n}</div>` });
        const m = L.marker([cl.lat, cl.lon], { icon, keyboard: true, title: `${n} catches — zoom in` }).addTo(layer);
        m.on("click", () => {
          const b = L.latLngBounds(cl.items.map((c) => [c.lat, c.lon]));
          if (b.isValid() && b.getSouthWest().distanceTo(b.getNorthEast()) > 30) map.fitBounds(b.pad(0.3), { maxZoom: 16 });
          else map.setView([cl.lat, cl.lon], Math.min(17, map.getZoom() + 3));
        });
      }
    });
    setShown(visible.length);
  }, [visible]);

  useEffect(() => {
    const map = mapInstance.current;
    if (!map) return undefined;
    draw();
    map.on("zoomend moveend", draw);
    return () => { map.off("zoomend moveend", draw); };
  }, [draw]);

  useEffect(() => {
    const map = mapInstance.current;
    if (!map || !visible.length) return;
    setTimeout(() => map.invalidateSize(), 50);
    const b = window.L.latLngBounds(visible.map((c) => [c.lat, c.lon]));
    if (b.isValid()) map.fitBounds(b.pad(0.35), { maxZoom: 10 });
  }, [visible]);

  function nearMe() {
    if (!navigator.geolocation || !mapInstance.current) return;
    navigator.geolocation.getCurrentPosition((pos) => mapInstance.current && mapInstance.current.setView([pos.coords.latitude, pos.coords.longitude], 9), () => {}, { timeout: 8000 });
  }

  if (!leafletAvailable) {
    return (
      <CardShell title="CATCH MAP">
        <div className="tb-mono text-xs" style={{ color: "var(--tb-muted)" }}>The map needs the installed app to load — not available in this preview.</div>
      </CardShell>
    );
  }

  const empty = !error && all && all.length === 0;
  return (
    <CardShell title="CATCH MAP" subtitle="catches anglers chose to share — locations are blurred to about a kilometre">
      {speciesChips.length > 0 && (
        <div className="flex gap-2 overflow-x-auto tb-scroll pb-2" style={{ scrollbarWidth: "none" }}>
          <ChipButton active={!filter} onClick={() => setFilter("")} label="All" />
          {speciesChips.map((s) => <ChipButton key={s} active={filter === s} onClick={() => setFilter(filter === s ? "" : s)} label={s} />)}
        </div>
      )}
      {error && <div className="tb-mono text-xs mb-2" style={{ color: "var(--tb-flare)" }}>{error}</div>}
      <div className="relative">
        <div ref={mapRef} style={{ height: 340, borderRadius: 12, overflow: "hidden" }} />
        {empty && (
          <div className="absolute inset-0 flex items-center justify-center text-center px-6 rounded-xl" style={{ background: "rgba(4,7,7,0.72)", zIndex: 500 }}>
            <span className="text-[14px]" style={{ color: "var(--tb-text)" }}>No shared catch locations yet. Tick “Also show on the community map” when you log a catch to be the first.</span>
          </div>
        )}
      </div>
      <div className="flex items-center justify-between mt-2">
        <span className="text-[13px]" style={{ color: "var(--tb-muted)" }}>{all ? `${shown} catch${shown === 1 ? "" : "es"} shown` : "Loading…"}</span>
        <div className="flex gap-2">
          <button onClick={nearMe} className="px-3 py-1.5 rounded-full text-[13px] font-bold" style={{ background: "var(--tb-surface-2)", color: "var(--tb-text)", border: "1px solid var(--tb-line)" }}>Near me</button>
          <button onClick={load} aria-label="Refresh map" className="w-8 h-8 rounded-md flex items-center justify-center" style={{ background: "var(--tb-surface-2)" }}><RefreshCw size={13} style={{ color: "var(--tb-muted)" }} /></button>
        </div>
      </div>
    </CardShell>
  );
}

export default function TackleTracker() {
  const [view, setView] = useState("tackle"); // 'tackle' | 'conditions' | 'catches'
  const [items, setItems] = useState(null);
  const [activeCategory, setActiveCategory] = useState(null);
  const [search, setSearch] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [editingItem, setEditingItem] = useState(null);
  const [formPrefill, setFormPrefill] = useState(null);
  const [showScan, setShowScan] = useState(false);
  const [tackleSubView, setTackleSubView] = useState("gear"); // 'gear' | 'guide' | 'knots'
  const [showSettings, setShowSettings] = useState(false);
  const [saveError, setSaveError] = useState(false);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);
  const safety = useSafetyAlerts();
  const [updateReady, setUpdateReady] = useState(false);

  // A new version was installed in the background: offer a one-tap reload instead of
  // making people open the app twice.
  useEffect(() => {
    if (!("serviceWorker" in navigator)) return undefined;
    let cancelled = false;
    navigator.serviceWorker.getRegistration().then((reg) => {
      if (!reg || cancelled) return;
      if (reg.waiting && navigator.serviceWorker.controller) setUpdateReady(true);
      reg.addEventListener("updatefound", () => {
        const w = reg.installing;
        if (!w) return;
        w.addEventListener("statechange", () => {
          if (w.state === "installed" && navigator.serviceWorker.controller) setUpdateReady(true);
        });
      });
    }).catch(() => {});
    return () => { cancelled = true; };
  }, []);

  const [catches, setCatches] = useState(null);
  const [showCatchForm, setShowCatchForm] = useState(false);
  const [editingCatch, setEditingCatch] = useState(null);

  function openQuickAdd(name, category) {
    setEditingItem(null);
    setFormPrefill({ name: capitalize(name), category: category || "lures" });
    setView("tackle");
    setShowForm(true);
  }

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        setItems(res && res.value ? JSON.parse(res.value) : []);
      } catch (e) {
        setItems([]);
      }
    })();
    (async () => {
      try {
        const res = await window.storage.get(CATCH_KEY, false);
        setCatches(res && res.value ? JSON.parse(res.value) : []);
      } catch (e) {
        setCatches([]);
      }
    })();
  }, []);

  useEffect(() => {
    if (items === null) return;
    (async () => {
      try {
        const res = await window.storage.set(STORAGE_KEY, JSON.stringify(items), false);
        setSaveError(!res);
      } catch (e) {
        setSaveError(true);
      }
    })();
  }, [items]);

  useEffect(() => {
    if (catches === null) return;
    (async () => {
      try {
        const res = await window.storage.set(CATCH_KEY, JSON.stringify(catches), false);
        setSaveError((prev) => (res ? prev : true));
      } catch (e) {
        setSaveError(true);
      }
    })();
  }, [catches]);

  useEffect(() => { proBillingRefresh(); }, []);

  // Older catches that have a GPS tag get their weather filled in a few at a time, politely.
  const condTried = useRef(new Set());
  useEffect(() => {
    if (!catches) return undefined;
    const todo = catches.filter((c) => c.gps && c.dateTime && (!c.conditions || c.condKey !== proCondKey(c)) && !condTried.current.has(c.id)).slice(0, 4);
    if (!todo.length) return undefined;
    let off = false;
    (async () => {
      for (const c of todo) {
        condTried.current.add(c.id);
        if (off) return;
        await attachConditions(c);
        await new Promise((r) => setTimeout(r, 600));
      }
    })();
    return () => { off = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [catches === null]);

  function showToast(msg) {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 1800);
  }

  function upsertItem(item) {
    setItems((prev) => {
      const exists = prev.some((i) => i.id === item.id);
      if (exists) return prev.map((i) => (i.id === item.id ? item : i));
      return [...prev, item];
    });
    showToast(editingItem ? "Item updated" : "Item added to tackle box");
    setShowForm(false);
    setEditingItem(null);
    setFormPrefill(null);
  }

  // Items identified from photos: merge duplicates by name + compartment, otherwise add new.
  function addScanned(list) {
    const norm = (t) => String(t || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
    setItems((prev) => {
      const next = prev.slice();
      for (const n of list) {
        const at = next.findIndex((i) => i.category === n.category && norm(i.name) === norm(n.name));
        if (at >= 0) next[at] = { ...next[at], quantity: (Number(next[at].quantity) || 0) + n.quantity, photo: next[at].photo || n.photo };
        else next.push({ id: uid(), name: n.name, category: n.category, spec: n.spec, quantity: n.quantity, lowThreshold: 1, location: "", condition: CONDITIONS[0], notes: n.notes || "", photo: n.photo || null, lastServiced: null, serviceIntervalDays: null });
      }
      return next;
    });
    showToast(list.length === 1 ? "Added to your tackle box" : `${list.length} items added to your tackle box`);
    setShowScan(false);
  }

  // Attach the weather/moon/pressure at the moment of the catch (powers Insights). Runs in the background.
  async function attachConditions(rec) {
    try {
      const saved = rec.gps ? null : await proReadSavedLocation();
      const snap = await proSnapshotForCatch(rec, saved);
      if (snap) setCatches((prev) => (prev ? prev.map((c) => (c.id === rec.id ? { ...c, conditions: snap, condKey: proCondKey(c) } : c)) : prev));
    } catch (e) { /* offline — retried next time the app opens */ }
  }

  function upsertCatch(record) {
    const prior = (catches || []).find((c) => c.id === record.id);
    const keep = prior && prior.conditions && prior.condKey === proCondKey(record) ? { conditions: prior.conditions, condKey: prior.condKey } : {};
    const next = { ...record, ...keep };
    setCatches((prev) => {
      const exists = prev.some((c) => c.id === next.id);
      if (exists) return prev.map((c) => (c.id === next.id ? next : c));
      return [next, ...prev];
    });
    if (!keep.conditions) attachConditions(next);
    showToast(editingCatch ? "Catch updated" : "Catch logged");
    setShowCatchForm(false);
    setEditingCatch(null);
  }

  function deleteCatch(id) {
    setCatches((prev) => prev.filter((c) => c.id !== id));
    showToast("Catch removed");
  }

  function deleteItem(id) {
    setItems((prev) => prev.filter((i) => i.id !== id));
    showToast("Item removed");
  }

  function adjustQty(id, delta) {
    setItems((prev) =>
      prev.map((i) => (i.id === id ? { ...i, quantity: Math.max(0, i.quantity + delta) } : i))
    );
  }

  const loading = items === null;
  const counts = {};
  const lowCounts = {};
  if (!loading) {
    for (const c of CATEGORIES) {
      counts[c.id] = items.filter((i) => i.category === c.id).length;

      ).length;
    }
  }

  const filteredSearch =
    !loading && search.trim()
      ? items.filter(
          (i) =>
            i.name.toLowerCase().includes(search.toLowerCase()) ||
            (i.spec || "").toLowerCase().includes(search.toLowerCase()) ||
            (i.location || "").toLowerCase().includes(search.toLowerCase())
        )
      : null;

  const activeItems =
    !loading && activeCategory ? items.filter((i) => i.category === activeCategory) : [];

  const lowTotal = CATEGORIES.reduce((n, c) => n + (lowCounts[c.id] || 0), 0);
  const itemCount = items ? items.length : 0;
  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : word.endsWith("ch") ? "es" : "s"}`;
  const SCREEN_META = {
    tackle: {

      note: tackleSubView === "guide" ? "Learn to spot lures, hooks and rigs" : tackleSubView === "knots" ? "Knots you can tie on the water" : loading ? "" : itemCount === 0 ? "Your box is empty. Add your first item." : lowTotal > 0 ? `${plural(itemCount, "item")}, ${lowTotal} running low` : `${plural(itemCount, "item")}, all stocked`,
    },
    conditions: { title: "Conditions", note: "Weather, tides and when the bite is on" },
    catches: {

      note: catches === null ? "" : catches.length === 0 ? "No fish logged yet" : `${plural(catches.length, "catch")} logged`,
    },
    spots: { title: "Spots", note: "Where you catch fish, and where to try next" },
    community: { title: "Community", note: "Anglers, catches and chat" },
  };
  const meta = SCREEN_META[view] || SCREEN_META.tackle;

  return (
    <div
      style={{
        fontFamily: "'Atkinson Hyperlegible', system-ui, sans-serif",
        background: "var(--tb-bg)",
        color: "var(--tb-text)",
        height: "100dvh",
        boxShadow: "0 0 0 1px var(--tb-line)",
      }}
      className="w-full max-w-md mx-auto relative overflow-hidden flex flex-col"
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Stencil:wght@700;800&display=swap');
        :root {

        }
        .tb-stencil { font-family: 'Big Shoulders Stencil', 'Arial Narrow', sans-serif; letter-spacing: 0.03em; font-weight: 800; text-transform: uppercase; }
        /* "tb-mono" is the old data-label class; it now means tabular figures in the body face. */
        .tb-mono { font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: 0; }

          role="status"
        >
          <div className="min-w-0">

            <div className="text-[13px]" style={{ color: "var(--tb-muted)" }}>A new version of Epic Fishy is installed.</div>
          </div>
          <button

            className="shrink-0 px-4 py-2 rounded-xl text-[14px] font-bold"

            Reload

        </div>
      )}

      <BottomNav view={view} onChange={(v) => { haptic(); setView(v); }} />

      {/* Toast */}
      {toast && (
        <div className="tb-toast absolute left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-full text-[14px] z-20" style={{ bottom: "calc(150px + env(safe-area-inset-bottom, 0px))", background: "var(--tb-surface-2)", color: "var(--tb-text)", border: "1px solid var(--tb-line)" }}>
          {toast}
        </div>
      )}

      {saveError && (
        <div className="absolute top-2 left-1/2 -translate-x-1/2 px-3 py-1 rounded-full text-[12px] font-bold z-20" style={{ background: "var(--tb-flare)", color: "var(--tb-bg)" }}>
          Couldn't save. Check your connection.
        </div>
      )}

      {/* Category tray */}
      {activeCategory && !showForm && view === "tackle" && (
        <div className="tb-overlay absolute inset-0 z-20" style={{ background: "rgba(10,16,19,0.55)" }} onClick={() => setActiveCategory(null)}>
          <div className="tb-tray absolute bottom-0 left-0 right-0 rounded-t-2xl px-4 pt-3 pb-5" style={{ background: "var(--tb-bg)", border: "1px solid var(--tb-line)", maxHeight: "82%", display: "flex", flexDirection: "column" }} onClick={(e) => e.stopPropagation()}>
            <div className="w-10 h-1 rounded-full mx-auto mb-3" style={{ background: "var(--tb-line)" }} />
            <div className="flex items-center gap-2 mb-3">
              <button onClick={() => setActiveCategory(null)}>
                <ChevronLeft size={20} style={{ color: "var(--tb-muted)" }} />
              </button>
              <h2 className="tb-stencil text-xl" style={{ color: "var(--tb-text)" }}>
                {CATEGORIES.find((c) => c.id === activeCategory)?.label.toUpperCase()}

            </div>
            <div className="tb-scroll overflow-y-auto space-y-2 pb-2">
              {activeItems.length === 0 ? (
                <EmptyState text="This compartment is empty. Add your first item." />
              ) : (
                activeItems.map((item) => (
                  <ItemRow key={item.id} item={item} onAdjust={adjustQty} onEdit={() => { setEditingItem(item); setShowForm(true); }} onDelete={() => deleteItem(item.id)} />
                ))
              )}
            </div>
          </div>
        </div>
      )}

      {/* Add/Edit form */}
      {showForm && (
        <ItemForm initial={editingItem || formPrefill} defaultCategory={activeCategory} onCancel={() => { setShowForm(false); setEditingItem(null); setFormPrefill(null); }} onSave={upsertItem} />
      )}

      {showCatchForm && (
        <CatchForm
          initial={editingCatch}
          items={items || []}
          existingTrips={[...new Set((catches || []).map((c) => c.tripName).filter(Boolean))]}
          recentSpecies={[...new Set([...(catches || [])].sort((a, b) => new Date(b.dateTime) - new Date(a.dateTime)).map((c) => c.species).filter(Boolean))].slice(0, 6)}
          onCancel={() => { setShowCatchForm(false); setEditingCatch(null); }}
          onSave={upsertCatch}
        />
      )}

      {showSettings && <SettingsPanel onClose={() => setShowSettings(false)} />}
      {showScan && <ScanTackleSheet onClose={() => setShowScan(false)} onAdd={addScanned} onOpenSettings={() => { setShowScan(false); setShowSettings(true); }} />}
    </div>
  );
}

      <path d="M16 9.5V21.5a5.6 5.6 0 0 1-11.2 0v-3.2" transform="translate(5.6 0)" fill="none" stroke="var(--tb-bg)" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" />

function EmptyState({ text }) {
  return (
    <div className="rounded-2xl px-6 py-10 text-center" style={{ border: "1px dashed var(--tb-line)" }}>
      <Waves size={28} className="mx-auto mb-3" style={{ color: "var(--tb-brass-dim)" }} aria-hidden="true" />
      <p className="text-[15px] leading-snug mx-auto max-w-[270px]" style={{ color: "var(--tb-muted)" }}>{text}</p>
    </div>

function isMaintenanceDue(item) {
  if (!item.lastServiced || !item.serviceIntervalDays) return false;
  const last = new Date(item.lastServiced);
  const dueDate = new Date(last.getTime() + item.serviceIntervalDays * 86400000);
  return new Date() >= dueDate;
}

function ItemRow({ item, onAdjust, onEdit, onDelete }) {
  const low = item.quantity <= (item.lowThreshold ?? 2);
  const serviceDue = isMaintenanceDue(item);
  const [showPhoto, setShowPhoto] = useState(false);
  const CategoryIcon = CATEGORIES.find((c) => c.id === item.category)?.icon || Package;
  return (
    <div className="rounded-xl p-3 flex items-center gap-3" style={{ background: "var(--tb-surface)", border: "1px solid var(--tb-line)" }}>
      {item.photo ? (
        <img
          src={item.photo}
          alt=""
          onClick={() => setShowPhoto(true)}
          className="w-11 h-11 rounded-lg object-cover shrink-0"
          style={{ border: "1px solid var(--tb-line)" }}
        />
      ) : (
        <div className="w-11 h-11 rounded-lg flex items-center justify-center shrink-0" style={{ background: "var(--tb-surface-2)" }}>
          <CategoryIcon size={18} style={{ color: "var(--tb-brass)" }} />
        </div>
      )}
      <div className="flex-1 min-w-0" onClick={onEdit}>
        <div className="flex items-center gap-1.5">
          <span className="text-sm font-semibold truncate" style={{ color: "var(--tb-text)" }}>{item.name}</span>
          {low && <AlertTriangle size={12} style={{ color: "var(--tb-flare)" }} />}
          {serviceDue && <Wrench size={12} style={{ color: "var(--tb-flare)" }} />}
        </div>
        <div className="tb-mono text-[11px] mt-0.5 truncate" style={{ color: "var(--tb-muted)" }}>
          {[item.spec, item.location, item.condition].filter(Boolean).join(" · ")}
        </div>
        {serviceDue && (
          <div className="tb-mono text-[10px] mt-0.5" style={{ color: "var(--tb-flare)" }}>Service due</div>
        )}
      </div>
      <div className="flex items-center gap-1.5 shrink-0">
        <button onClick={() => onAdjust(item.id, -1)} className="w-7 h-7 rounded-md flex items-center justify-center" style={{ background: "var(--tb-surface-2)", color: "var(--tb-text)" }}>
          <Minus size={13} />
        </button>
        <span className="tb-mono text-sm w-6 text-center" style={{ color: "var(--tb-text)" }}>{item.quantity}</span>
        <button onClick={() => onAdjust(item.id, 1)} className="w-7 h-7 rounded-md flex items-center justify-center" style={{ background: "var(--tb-surface-2)", color: "var(--tb-text)" }}>
          <Plus size={13} />
        </button>
        <button onClick={onDelete} className="w-7 h-7 rounded-md flex items-center justify-center ml-0.5" style={{ color: "var(--tb-flare)" }}>
          <Trash2 size={14} />
        </button>
      </div>
      {showPhoto && item.photo && <PhotoLightbox src={item.photo} onClose={() => setShowPhoto(false)} />}
    </div>
  );
}

function ItemForm({ initial, defaultCategory, onCancel, onSave }) {
  const [name, setName] = useState(initial?.name || "");
  const [category, setCategory] = useState(initial?.category || defaultCategory || "lures");
  const [spec, setSpec] = useState(initial?.spec || "");
  const [quantity, setQuantity] = useState(initial?.quantity ?? 1);
  const [lowThreshold, setLowThreshold] = useState(initial?.lowThreshold ?? 2);
  const [location, setLocation] = useState(initial?.location || "");
  const [condition, setCondition] = useState(initial?.condition || CONDITIONS[0]);
  const [notes, setNotes] = useState(initial?.notes || "");
  const [photo, setPhoto] = useState(initial?.photo || null);
  const [lastServiced, setLastServiced] = useState(initial?.lastServiced ? initial.lastServiced.slice(0, 10) : "");
  const [serviceIntervalDays, setServiceIntervalDays] = useState(initial?.serviceIntervalDays || "");

  function submit() {
    if (!name.trim()) return;
    onSave({
      id: initial?.id || uid(),
      name: name.trim(),
      category,
      spec: spec.trim(),
      quantity: Number(quantity) || 0,
      lowThreshold: Number(lowThreshold) || 0,
      location: location.trim(),
      condition,
      notes: notes.trim(),
      photo,
      lastServiced: lastServiced ? new Date(lastServiced).toISOString() : null,
      serviceIntervalDays: serviceIntervalDays === "" ? null : Number(serviceIntervalDays),
    });
  }

  const inputStyle = { background: "var(--tb-surface-2)", color: "var(--tb-text)", border: "1px solid var(--tb-line)" };

  return (
    <div className="tb-overlay absolute inset-0 z-30" style={{ background: "rgba(10,16,19,0.65)" }}>
      <div className="tb-tray absolute bottom-0 left-0 right-0 rounded-t-2xl px-5 pt-4 pb-6" style={{ background: "var(--tb-bg)", border: "1px solid var(--tb-line)", maxHeight: "90%", overflowY: "auto" }}>
        <div className="flex items-center justify-between mb-4">
          <h2 className="tb-stencil text-xl" style={{ color: "var(--tb-text)" }}>{initial ? "EDIT ITEM" : "ADD ITEM"}</h2>
          <button onClick={onCancel}><X size={20} style={{ color: "var(--tb-muted)" }} /></button>
        </div>

        <div className="space-y-3">
          <Field label="Name">
            <input autoFocus value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Texas Rig Worm Hooks" className="w-full rounded-lg py-2 px-3 text-sm outline-none" style={inputStyle} />
          </Field>
          <PhotoField photo={photo} onChange={setPhoto} />
          <Field label="Compartment">
            <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full rounded-lg py-2 px-3 text-sm outline-none" style={inputStyle}>
              {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
            </select>
          </Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Size / spec">

function PhotoField({ photo, onChange, label = "Photo" }) {

  async function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setBusy(true);
    setError(null);
    try {
      const dataUrl = await compressImage(file);
      onChange(dataUrl);
    } catch (err) {
      setError("Couldn't process that photo — try another.");

  return (
    <Field label={label}>
      <input ref={inputRef} type="file" accept="image/*" onChange={handleFile} className="hidden" />

        <div className="flex items-center gap-2 text-xs tb-mono rounded-lg py-2 px-3" style={{ background: "var(--tb-surface-2)", border: "1px solid var(--tb-line)" }}>

function groupCatchesByTrip(sortedCatches) {
  const groups = {};
  for (const c of sortedCatches) {
    const key = c.tripName && c.tripName.trim() ? c.tripName.trim() : "Ungrouped catches";
    if (!groups[key]) groups[key] = [];
    groups[key].push(c);
  }
  return Object.entries(groups)
    .map(([tripName, list]) => {
      const bestC = list.reduce((best, c) => {
        const lb = weightToLb(c.weight, c.weightUnit);
        return !best || lb > weightToLb(best.weight, best.weightUnit) ? c : best;
      }, null);
      return { tripName, catches: list, bestC };
    })
    .sort((a, b) => {
      if (a.tripName === "Ungrouped catches") return 1;
      if (b.tripName === "Ungrouped catches") return -1;
      return new Date(b.catches[0].dateTime) - new Date(a.catches[0].dateTime);
    });
}

function CatchesView({ catches, items, onEdit, onDelete, onToast }) {
  const [groupByTrip, setGroupByTrip] = useState(false);
  const bestIds = personalBestIds(catches || []);

  if (catches === null) {
    return <div className="py-16 text-center" style={{ color: "var(--tb-muted)" }}>Loading your catch log...</div>;
  }

  if (catches.length === 0) {
    return (
      <div className="py-10 text-center space-y-3">
        <Fish size={32} className="mx-auto" style={{ color: "var(--tb-brass)" }} />
        <p className="text-sm" style={{ color: "var(--tb-muted)" }}>
          No catches logged yet. Tap + to record your first fish.
        </p>
      </div>
    );
  }

  const sorted = [...catches].sort((a, b) => new Date(b.dateTime) - new Date(a.dateTime));
  const bestWeight = catches.reduce((best, c) => {
    const lb = weightToLb(c.weight, c.weightUnit);
    return lb > best.lb ? { lb, c } : best;
  }, { lb: 0, c: null });
  const bestLength = catches.reduce((best, c) => {
    const inches = lengthToIn(c.length, c.lengthUnit);
    return inches > best.inches ? { inches, c } : best;
  }, { inches: 0, c: null });

  const speciesCounts = {};
  for (const c of catches) {
    if (c.species) speciesCounts[c.species] = (speciesCounts[c.species] || 0) + 1;
  }
  const topSpecies = Object.entries(speciesCounts).sort((a, b) => b[1] - a[1])[0];
  const trips = groupByTrip ? groupCatchesByTrip(sorted) : null;

  return (
    <div className="space-y-3">
      <ProCatchHub catches={catches} />
      <div className="grid grid-cols-3 gap-2">
        <StatTile label="Total" value={catches.length} />
        <StatTile label="Top species" value={topSpecies ? topSpecies[0] : "—"} small />
        <StatTile
          label="Personal best"
          value={bestWeight.c ? `${bestWeight.c.weight} ${bestWeight.c.weightUnit}` : "—"}
          icon={Trophy}
          small
        />
      </div>

      <div className="flex justify-end">
        <button
          onClick={() => setGroupByTrip((v) => !v)}
          className="text-xs tb-mono px-3 py-1.5 rounded-full"
          style={{ background: groupByTrip ? "var(--tb-brass)" : "var(--tb-surface-2)", color: groupByTrip ? "var(--tb-bg)" : "var(--tb-text)", border: "1px solid var(--tb-line)" }}
        >
          {groupByTrip ? "Ungroup" : "Group by trip"}
        </button>
      </div>

      {!groupByTrip && (
        <div className="space-y-2">
          {sorted.map((c) => (
            <CatchRow key={c.id} record={c} isBest={bestIds.has(c.id)} onToast={onToast} onEdit={() => onEdit(c)} onDelete={() => onDelete(c.id)} />
          ))}
        </div>
      )}

      {groupByTrip && (
        <div className="space-y-4">
          {trips.map((t) => (
            <div key={t.tripName}>
              <div className="flex items-center justify-between mb-1.5 px-1">
                <span className="text-sm font-semibold" style={{ color: "var(--tb-text)" }}>{t.tripName}</span>
                <span className="tb-mono text-[11px]" style={{ color: "var(--tb-muted)" }}>
                  {t.catches.length} catch{t.catches.length !== 1 ? "es" : ""}
                  {t.bestC && t.bestC.weight ? ` · best ${t.bestC.weight} ${t.bestC.weightUnit}` : ""}
                </span>
              </div>
              <div className="space-y-2">
                {t.catches.map((c) => (
                  <CatchRow key={c.id} record={c} isBest={bestIds.has(c.id)} onToast={onToast} onEdit={() => onEdit(c)} onDelete={() => onDelete(c.id)} />
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function toDatetimeLocal(d) {
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function CatchForm({ initial, items, existingTrips = [], recentSpecies = [], onCancel, onSave }) {
  const [species, setSpecies] = useState(initial?.species || "");
  const [length, setLength] = useState(initial?.length || "");
  const [lengthUnit, setLengthUnit] = useState(initial?.lengthUnit || (isMetric() ? "cm" : "in"));
  const [weight, setWeight] = useState(initial?.weight || "");
  const [weightUnit, setWeightUnit] = useState(initial?.weightUnit || (isMetric() ? "kg" : "lb"));
  const [dateTime, setDateTime] = useState(initial?.dateTime ? initial.dateTime.slice(0, 16) : toDatetimeLocal(new Date()));
  const [location, setLocation] = useState(initial?.location || "");
  const [tripName, setTripName] = useState(initial?.tripName || "");
  const [lure, setLure] = useState(initial?.lure || "");
  const [notes, setNotes] = useState(initial?.notes || "");
  const [gps, setGps] = useState(initial?.gps || null);
  const [gpsStatus, setGpsStatus] = useState(initial?.gps ? "ok" : "idle"); // idle | locating | ok | error
  const [photo, setPhoto] = useState(initial?.photo || null);
  const [shareToCommunity, setShareToCommunity] = useState(false);
  const [shareApproxLocation, setShareApproxLocation] = useState(false);
  const communityAvailable = typeof window !== "undefined" && window.communityAPI && window.communityAPI.configured;

  const captureGps = useCallback(() => {
    if (!navigator.geolocation) {
      setGpsStatus("error");
      return;
    }
    setGpsStatus("locating");
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        setGps({ lat: pos.coords.latitude, lon: pos.coords.longitude, accuracy: pos.coords.accuracy });
        setGpsStatus("ok");
      },
      () => setGpsStatus("error"),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }, []);

  useEffect(() => {
    // Only auto-tag brand new catches — edits keep whatever was saved unless the angler retags.
    if (!initial) captureGps();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  function submit() {
    if (!species.trim()) return;
    onSave({
      id: initial?.id || uid(),
      species: species.trim(),
      length: length === "" ? null : Number(length),
      lengthUnit,
      weight: weight === "" ? null : Number(weight),
      weightUnit,
      dateTime: new Date(dateTime).toISOString(),
      location: location.trim(),
      tripName: tripName.trim(),
      lure: lure.trim(),
      notes: notes.trim(),
      gps,
      photo,
    });
    if (shareToCommunity && communityAvailable && window.communityAPI.ready) {
      const fuzzedRaw = shareApproxLocation && gps ? fuzzCoordinate(gps.lat, gps.lon, 0.5) : null;
      const fuzzed = fuzzedRaw ? proSnapShared(fuzzedRaw.lat, fuzzedRaw.lon) : null;
      window.communityAPI.addCatch({
        species: species.trim(),
        length: length === "" ? null : Number(length),
        lengthUnit,
        weight: weight === "" ? null : Number(weight),
        weightUnit,
        dateTime: new Date(dateTime).toISOString(),
        location: location.trim(),
        lure: lure.trim(),
        photo: photo || null,
        lat: fuzzed ? fuzzed.lat : null,
        lon: fuzzed ? fuzzed.lon : null,
      }).catch(() => {});
    }
  }

  const inputStyle = { background: "var(--tb-surface-2)", color: "var(--tb-text)", border: "1px solid var(--tb-line)" };

  return (
    <div className="tb-overlay absolute inset-0 z-30" style={{ background: "rgba(10,16,19,0.65)" }}>
      <div className="tb-tray absolute bottom-0 left-0 right-0 rounded-t-2xl px-5 pt-4 pb-6" style={{ background: "var(--tb-bg)", border: "1px solid var(--tb-line)", maxHeight: "90%", overflowY: "auto" }}>
        <div className="flex items-center justify-between mb-4">
          <h2 className="tb-stencil text-xl" style={{ color: "var(--tb-text)" }}>{initial ? "EDIT CATCH" : "LOG A CATCH"}</h2>
          <button onClick={onCancel}><X size={20} style={{ color: "var(--tb-muted)" }} /></button>
        </div>

        <div className="space-y-3">
          <Field label="Species">
            <input autoFocus value={species} onChange={(e) => setSpecies(e.target.value)} placeholder="e.g. Largemouth bass" list="species-suggestions" className="w-full rounded-lg py-2 px-3 text-sm outline-none" style={inputStyle} />
            <datalist id="species-suggestions">
              {[...new Set([...recentSpecies, ...COMMON_SPECIES])].map((sp) => <option key={sp} value={sp} />)}
            </datalist>
          </Field>
          {!species && (
            <div className="flex gap-2 overflow-x-auto tb-scroll -mt-1 pb-1" style={{ scrollbarWidth: "none" }}>
              {[...new Set([...recentSpecies, ...COMMON_SPECIES])].slice(0, 8).map((sp) => (
                <ChipButton key={sp} active={false} onClick={() => { haptic(); setSpecies(sp); }} label={sp} />
              ))}
            </div>
          )}

          <ProSpeciesSuggest gps={gps} hasPhoto={!!photo} current={species} onPick={setSpecies} />

          <PhotoField photo={photo} onChange={setPhoto} label="Catch photo" />

          <div className="grid grid-cols-2 gap-3">
            <Field label="Length">
              <div className="flex gap-1.5">
                <input type="number" min="0" step="0.1" value={length} onChange={(e) => setLength(e.target.value)} className="w-full rounded-lg py-2 px-3 text-sm outline-none tb-mono" style={inputStyle} />
                <select value={lengthUnit} onChange={(e) => setLengthUnit(e.target.value)} className="rounded-lg px-2 text-sm outline-none" style={inputStyle}>
                  <option value="in">in</option>
                  <option value="cm">cm</option>
                </select>
              </div>
            </Field>
            <Field label="Weight">
              <div className="flex gap-1.5">
                <input type="number" min="0" step="0.1" value={weight} onChange={(e) => setWeight(e.target.value)} className="w-full rounded-lg py-2 px-3 text-sm outline-none tb-mono" style={inputStyle} />
                <select value={weightUnit} onChange={(e) => setWeightUnit(e.target.value)} className="rounded-lg px-2 text-sm outline-none" style={inputStyle}>
                  <option value="lb">lb</option>
                  <option value="kg">kg</option>
                </select>
              </div>
            </Field>
          </div>

          <Field label="Date & time">
            <input type="datetime-local" value={dateTime} onChange={(e) => setDateTime(e.target.value)} className="w-full rounded-lg py-2 px-3 text-sm outline-none tb-mono" style={inputStyle} />
          </Field>

          <Field label="Location">

                  {gps.lat.toFixed(5)}, {gps.lon.toFixed(5)}

          <Field label="Notes (optional)">

                <span className="text-xs tb-mono" style={{ color: "var(--tb-text)" }}>

                <label className="flex items-center gap-2.5 pl-6">
                  <input type="checkbox" checked={shareApproxLocation} onChange={(e) => setShareApproxLocation(e.target.checked)} className="w-4 h-4" />

        <div className="flex gap-3 mt-5">
